title: Security requirements for suppliers
description: 'When procuring controllers, drives, HMIs, network components and software, security requirements are contractually defined: support period, provision of security updates, notification of vulnerabilities, delivery of a component list (SBOM) and secure default settings. Fulfilment is assessed during supplier selection.'
