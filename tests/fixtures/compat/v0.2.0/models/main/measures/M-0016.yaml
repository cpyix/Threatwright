title: Local remote access kill switch
description: The operator can interrupt any remote connection on site at any time, e.g. via an easily accessible switch that de-energises the remote maintenance module or disconnects the uplink. Disconnection works independently of software and is shown on the HMI.
library_ref: lib:ot/measure/remote-access-kill-switch@1
kind: design
evidence: Electrical drawing with disconnect switch, test report of disconnection during a session.
