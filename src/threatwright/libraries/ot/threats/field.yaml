    sources: ["generic OT threat knowledge; MITRE EMB3D"]

  # --- controllers at the field level -----------------------------------------------
  - id: controller-io-forcing
    rev: 1
    stride: [T]
    applies_to: [plc, safety-relevant-outputs]
    title:
      de: Forcen von Ein- und Ausgängen über die Online-Funktion von {element}
      en: Forcing inputs and outputs via the online function of {element}
    scenario:
      de: >-
        Engineering-Werkzeuge erlauben, Ein- und Ausgänge im Prozessabbild der
        Steuerung zu forcen, also unabhängig vom Programm fest auf einen Wert zu
        setzen. Ein Angreifer mit Zugang zur Engineering-Schnittstelle setzt so
        Freigaben, Ventile oder Rückmeldungen dauerhaft.
      en: >-
        Engineering tools allow inputs and outputs in the controller's process
        image to be forced, i.e. set to a fixed value independent of the program.
        An attacker with access to the engineering interface thereby permanently
        sets enables, valves or feedback signals.
    consequence:
      de: >-
        Die Steuerungslogik wird ausgehebelt, Verriegelungen greifen nicht mehr und
        Aktoren schalten unabhängig vom Prozesszustand; Personen können gefährdet werden.
      en: >-
        The control logic is overridden, interlocks no longer work and actuators
        switch independently of the process state; persons can be endangered.
    environment: {interface: known_network, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-f]
    attack_ics: [T0835, T0831]
    iec62443: [FR2, FR3]
    measures: [role-based-access, strong-authentication, security-logging, safety-separation]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: controller-unattributed-change
    rev: 1
    stride: [R]
    applies_to: [plc, safety-plc]
    title:
      de: Programm- oder Parameteränderung an {element} ohne Urheberzuordnung
      en: Program or parameter change on {element} without attribution
    scenario:
      de: >-
        Die Steuerung akzeptiert Programmdownloads und Online-Änderungen über ein
        gemeinsam genutztes Konto oder ganz ohne Anmeldung und protokolliert nicht,
        wer wann was geändert hat. Ein Angreifer oder Innentäter ändert Programm
        oder Parameter, und die Änderung lässt sich niemandem zuordnen.
      en: >-
        The controller accepts program downloads and online changes via a shared
        account or without login and does not log who changed what and when. An
        attacker or insider changes program or parameters and the change cannot be
        attributed to anyone.
    consequence:
      de: >-
        Manipulationen bleiben unerkannt oder werden erst nach einem Vorfall
        bemerkt; Ursache und Verantwortung lassen sich nicht klären.
      en: >-
        Manipulation remains undetected or is noticed only after an incident;
        cause and responsibility cannot be determined.
    environment: {interface: known_network, access: restricted}
    impact: 3
    cra_refs: [AI-I-2-l, AI-I-2-d]
    attack_ics: [T0872]
    emb3d: [TID-225]
    iec62443: [FR6, FR1]
    measures: [security-logging, unique-device-credentials, log-protection, program-integrity-check]
    sources: ["generic OT threat knowledge"]

  - id: controller-program-upload
    rev: 1
    stride: [I]
    applies_to: [plc, safety-plc]
    title:
      de: Auslesen von Programm und Parametern aus {element}
      en: Readout of program and parameters from {element}
    scenario:
