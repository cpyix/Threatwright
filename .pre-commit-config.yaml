repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: forbidden-files
        name: forbidden files
        entry: python scripts/check_forbidden_files.py
        language: system
        pass_filenames: false
        always_run: true
