  - id: wirelesshart-join-key-compromise
    rev: 1
    stride: [T, I]
    applies_to: [wirelesshart, hart-multiplexer]
    title:
      de: Gemeinsamer Join-Schlüssel lässt fremde Geräte in {element} zu
      en: Shared join key admits foreign devices to {element}
    scenario:
      de: >-
        Alle Geräte des Funknetzes nutzen denselben Join-Schlüssel, der in
        Inbetriebnahmewerkzeugen, Dokumentation oder ausgebauten Geräten zu finden ist,
        und der Netzwerkmanager führt keine Liste zugelassener Geräte. Ein Angreifer
        bringt mit diesem Schlüssel ein eigenes Gerät in das Netz.
      en: >-
        All devices of the wireless network use the same join key, which can be found in
        commissioning tools, documentation or removed devices, and the network manager
        keeps no list of admitted devices. An attacker uses this key to bring their own
        device into the network.
    consequence:
      de: >-
        Das fremde Gerät liefert vorgetäuschte Messwerte unter einer echten
        Messstellenbezeichnung, beeinflusst das Routing im Mesh-Netz und erhält Einblick
        in Netzstruktur und Daten.
      en: >-
        The foreign device delivers spoofed measured values under a genuine tag,
        influences routing in the mesh network and gains insight into network structure
        and data.
    environment: {interface: local, access: non_restricted}
    impact: 3
    cra_refs: [AI-I-2-d, AI-I-2-e]
    attack_ics: [T0860, T0849]
    iec62443: [FR1, FR4]
    measures: [radio-key-management, secrets-protected-storage, network-monitoring-ids]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]
