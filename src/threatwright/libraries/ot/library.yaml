schema_version: 1
id: ot
version: 0.2.0
title:
  de: OT-Bibliothek für Maschinen und Anlagen
  en: OT library for machines and plants
license: CC-BY-4.0
description:
  de: >-
    Generische Element-, Bedrohungs- und Maßnahmenvorlagen für Produkte mit
    digitalen Elementen im Maschinen- und Anlagenbau, in der
    Prozessautomatisierung, bei Fernwirk- und IIoT-Systemen sowie in der Energie-
    und Gebäudetechnik. Vorschläge, keine vollständige Analyse; jede Übernahme
    ist im Produktkontext zu prüfen.
  en: >-
    Generic element, threat and measure templates for products with digital
    elements in machine and plant engineering, process automation, telecontrol
    and IIoT systems, and energy and building systems. Suggestions, not a
    complete analysis; review every entry in the context of your product.
