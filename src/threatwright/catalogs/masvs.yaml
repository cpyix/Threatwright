schema_version: 1
id: masvs
title: OWASP MASVS
version: v2.1.0
retrieved: '2026-10-20'
source: https://github.com/OWASP/masvs/tree/v2.1.0/controls
entries:
  MASVS-STORAGE-1: Sensitive data protected in app storage
  MASVS-STORAGE-2: No sensitive data leaks to other channels
  MASVS-CRYPTO-1: Current strong cryptography used correctly
  MASVS-CRYPTO-2: Cryptographic key management
  MASVS-AUTH-1: Secure authentication and authorization protocols
  MASVS-AUTH-2: Secure local authentication
  MASVS-AUTH-3: Extra authentication for sensitive operations
  MASVS-NETWORK-1: Network traffic secured
  MASVS-NETWORK-2: Identity pinning for own endpoints
  MASVS-PLATFORM-1: Secure use of IPC
  MASVS-PLATFORM-2: Secure use of WebViews
  MASVS-PLATFORM-3: Secure use of the user interface
  MASVS-CODE-1: Up-to-date platform version required
  MASVS-CODE-2: Enforced app updates
  MASVS-CODE-3: No components with known vulnerabilities
  MASVS-CODE-4: Untrusted input validated and sanitized
  MASVS-RESILIENCE-1: Platform integrity validated
  MASVS-RESILIENCE-2: Anti-tampering mechanisms
  MASVS-RESILIENCE-3: Anti-static-analysis mechanisms
  MASVS-RESILIENCE-4: Anti-dynamic-analysis mechanisms
  MASVS-PRIVACY-1: Minimal access to sensitive data and resources
  MASVS-PRIVACY-2: Prevention of user identification
  MASVS-PRIVACY-3: Transparency about data collection and sharing
  MASVS-PRIVACY-4: User control over their data
