name: release

# Tag vX.Y.Z (must match the version in pyproject.toml) -> GitHub Release with sdist, wheel,
# portable builds (Windows zip, Linux tar.gz), CycloneDX SBOMs, SHA256SUMS, Sigstore
# provenance; PyPI via trusted publishing; container image on ghcr.io.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build bundle and npm SBOM
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build
          # The bundle is compiled from devDependencies, so the SBOM includes them.
          npm sbom --sbom-format cyclonedx > ../sbom-npm.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: src/threatwright/web/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom-npm
          path: sbom-npm.cdx.json

  python:
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: src/threatwright/web
      - name: Tag matches package version
        run: test "$(uv version --short)" = "${GITHUB_REF_NAME#v}"
      - run: uv build
      - name: Python SBOM (runtime dependencies from uv.lock)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          uvx --from cyclonedx-bom==7.5.0 cyclonedx-py requirements requirements.txt -o sbom-python.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom-python
          path: sbom-python.cdx.json

  portable:
    needs: frontend
    strategy:
      matrix:
        # Linux pinned: the bundle needs at least the build system's glibc, so build on an
        # older base to run on older plant PCs (ubuntu-latest moves to 26.04 from 2026-10-19)
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: src/threatwright/web
      - run: uv sync --locked
      - run: uv run python packaging/build.py
      - name: Smoke test
        run: |
          ./dist/threatwright/threatwright --version
          ./dist/threatwright/threatwright validate tests/fixtures/project
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-portable-${{ matrix.os }}
          path: |
            dist/threatwright-*.zip
            dist/threatwright-*.tar.gz

  release:
    needs: [frontend, python, portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # Sigstore signing via GitHub OIDC
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums (keyless)
        working-directory: assets
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" assets/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  image:
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        id: meta
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$owner/threatwright" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
