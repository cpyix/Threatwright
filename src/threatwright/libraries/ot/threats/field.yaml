  # --- safety controller ------------------------------------------------------------
  - id: safety-plc-engineering-change
    rev: 1
    stride: [T, E]
    applies_to: [safety-plc]
    title:
      de: Änderung von Sicherheitsprogramm oder -parametern in {element} über Engineering-Zugang
      en: Change of safety program or parameters in {element} via engineering access
    scenario:
      de: >-
        Ein Angreifer verschafft sich Zugang zur Engineering-Schnittstelle der
        Sicherheitssteuerung, z. B. über eine kompromittierte Engineering-Workstation,
        einen Service-Laptop oder Fernwartung, und lädt ein verändertes
        Sicherheitsprogramm oder veränderte Sicherheitsparameter (Abschaltzeiten,
        Grenzwerte, Muting-Bedingungen).
      en: >-
        An attacker gains access to the engineering interface of the safety
        controller, e.g. via a compromised engineering workstation, a service laptop
        or remote maintenance, and downloads a modified safety program or modified
        safety parameters (switch-off times, limits, muting conditions).
    consequence:
      de: >-
        Schutzfunktionen sind abgeschwächt oder unwirksam, ohne dass dies im Betrieb
        sichtbar wird; Personen sind ungeschützt Gefahren ausgesetzt.
      en: >-
        Protective functions are weakened or ineffective without this being
        visible during operation; persons are exposed to hazards unprotected.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-f]
    attack_ics: [T0843, T0889, T0880]
    emb3d: [TID-303]
    iec62443: [FR1, FR2, FR3]
    measures: [strong-authentication, program-integrity-check, engineering-tool-integrity, change-management]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: safety-plc-weak-password
    rev: 1
    stride: [S]
    applies_to: [safety-plc]
    title:
      de: Standard- oder Sammelpasswort der Sicherheitssteuerung {element}
      en: Default or shared password of safety controller {element}
    scenario:
      de: >-
        Das Passwort, das Änderungen am Sicherheitsprogramm schützt, ist ab Werk
        gesetzt, für alle Maschinen gleich oder im Service-Team weit verbreitet.
        Ein Angreifer kennt oder errät es und tritt gegenüber der Steuerung als
        berechtigter Sicherheitsverantwortlicher auf.
      en: >-
        The password protecting changes to the safety program is set at the
        factory, identical for all machines or widely shared in the service team.
        An attacker knows or guesses it and acts towards the controller as an
        authorised safety engineer.
    consequence:
      de: >-
        Der wichtigste Schutz gegen Änderungen der Sicherheitsfunktionen ist
        wirkungslos; Manipulationen sind keiner Person zuordenbar.
      en: >-
        The main protection against changes of safety functions is ineffective;
        manipulations cannot be attributed to a person.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-b, AI-I-2-d]
    attack_ics: [T1694, T0859]
    emb3d: [TID-311, TID-314]
    iec62443: [FR1]
    measures: [unique-device-credentials, no-default-passwords, account-lockout, service-personnel-training]
    sources: ["generic OT threat knowledge; MITRE EMB3D"]

  - id: safety-telegram-forgery-black-channel
    rev: 1
    stride: [S, T]
    applies_to: [safety-plc, fieldbus-ethercat, fieldbus-profinet]
    title:
      de: Gefälschte Sicherheitstelegramme über den Black Channel von {element}
      en: Forged safety telegrams via the black channel of {element}
    scenario:
      de: >-
        Sicherheitsprotokolle nach dem Black-Channel-Prinzip sichern Telegramme mit
        CRC, Zähler und Adresse gegen zufällige Fehler, nicht gegen gezielte
        Angriffe. Ein Angreifer, der Protokoll, Adressen und Parameter kennt,
        erzeugt gültige Sicherheitstelegramme und meldet z. B. eine geschlossene
        Schutztür oder einen nicht betätigten Not-Halt.
      en: >-
        Safety protocols based on the black channel principle protect telegrams
        with CRC, counter and address against random errors, not against
        deliberate attacks. An attacker knowing protocol, addresses and parameters
        generates valid safety telegrams and reports e.g. a closed guard door or a
        non-actuated emergency stop.
    consequence:
      de: >-
        Die Sicherheitssteuerung hält eine Schutzfunktion für erfüllt, obwohl sie
        angefordert ist; Personen sind ungeschützt.
      en: >-
        The safety controller considers a protective function satisfied although
        it is demanded; persons are unprotected.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-f, AI-I-2-d]
    attack_ics: [T1692, T0880]
    emb3d: [TID-406, TID-407]
    iec62443: [FR3, FR1]
    measures: [fieldbus-physical-protection, fieldbus-topology-monitoring, safety-separation, protocol-security-extension]
    sources: ["generic OT threat knowledge"]

  - id: safety-plc-forced-safe-stop
    rev: 1
    stride: [D]
    applies_to: [safety-plc, safety-relevant-outputs]
    title:
      de: Provozierte Sicherheitsabschaltungen durch {element}
      en: Provoked safety shutdowns by {element}
    scenario:
      de: >-
        Ein Angreifer stört gezielt die sichere Kommunikation, z. B. durch
        ungültige oder verzögerte Sicherheitstelegramme, sodass Watchdogs der
        Sicherheitssteuerung auslösen. Die Steuerung schaltet wiederholt in den
        sicheren Zustand.
      en: >-
        An attacker deliberately disturbs safe communication, e.g. with invalid or
        delayed safety telegrams, so that the safety controller's watchdogs trip.
        The controller repeatedly switches to the safe state.
    consequence:
      de: >-
        Die Maschine steht wiederholt still und muss quittiert werden; der
        Produktionsdruck verleitet zum Umgehen von Schutzeinrichtungen.
      en: >-
        The machine stops repeatedly and must be acknowledged; production pressure
        tempts staff to bypass protective devices.
    environment: {interface: local, access: restricted}
    impact: 3
    cra_refs: [AI-I-2-h]
    attack_ics: [T0814, T0813]
    iec62443: [FR7]
    measures: [fieldbus-physical-protection, network-monitoring-ids, dos-rate-limiting]
    sources: ["generic OT threat knowledge"]

  # --- outputs with safety effect ----------------------------------------------------
  - id: safety-outputs-standard-technology
    rev: 1
    stride: [T, E]
    applies_to: [safety-relevant-outputs, plc, remote-io]
    title:
      de: Ausgänge mit Sicherheitswirkung in Standardtechnik ({element})
      en: Outputs with safety effect in standard technology ({element})
    scenario:
      de: >-
        Freigaben, Überbrückungen von Schutzeinrichtungen oder die Betriebsartenwahl
        werden über Standard-Ausgänge geschaltet, die von nicht sicherheitsgerichteter
        Software gesetzt werden. Ein Angreifer, der Programm, Prozessdaten oder
        Feldbus der Standardsteuerung manipuliert, setzt diese Ausgänge und hebelt
        so die Sicherheitsfunktion aus, ohne die Sicherheitssteuerung anzugreifen.
      en: >-
        Enables, bypasses of protective devices or operating mode selection are
        switched via standard outputs set by non-safety software. An attacker who
        manipulates the program, process data or fieldbus of the standard controller
        sets these outputs and thus defeats the safety function without attacking
        the safety controller.
    consequence:
      de: >-
        Schutzfunktionen werden überbrückt oder eine Betriebsart mit reduzierter
        Schutzwirkung wird aktiv; Personen können schwer verletzt werden.
      en: >-
        Protective functions are bypassed or an operating mode with reduced
        protection becomes active; persons can be seriously injured.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-f, AI-I-2-d]
    attack_ics: [T0837, T0880, T0858, T0835]
    iec62443: [FR3, FR5]
    measures: [safety-separation, bypass-hardwired-key, mode-selection-safety-rated, safe-communication-profile]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: safety-mode-selection-forged
    rev: 1
    stride: [S, T]
    applies_to: [safety-relevant-outputs, plc]
    title:
      de: Vorgetäuschte Betriebsartenwahl über {element}
      en: Spoofed operating mode selection via {element}
    scenario:
      de: >-
        Die Betriebsart (z. B. Einrichten, Automatik, Service) wird über eine
        Variable oder ein Netzwerktelegramm vom Bediengerät an die Steuerung
        übermittelt, ohne dass der Absender geprüft wird. Ein Angreifer sendet das
        Telegramm selbst und gibt sich als berechtigtes Bediengerät aus.
      en: >-
        The operating mode (e.g. setup, automatic, service) is transmitted from the
        operator panel to the controller via a variable or network telegram without
        verifying the sender. An attacker sends the telegram and poses as an
        authorised operator panel.
    consequence:
      de: >-
        Die Maschine wechselt in eine Betriebsart mit anderen Schutzmaßnahmen,
        während Personen sich auf den bisherigen Zustand verlassen.
      en: >-
        The machine changes to an operating mode with different protective measures
        while persons rely on the previous state.
    environment: {interface: known_network, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-f]
    attack_ics: [T0858, T1692]
    iec62443: [FR1, FR3]
    measures: [mode-selection-safety-rated, strong-authentication, local-control-priority]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: safety-bypass-unattributed
    rev: 1
    stride: [R]
    applies_to: [safety-relevant-outputs]
    title:
      de: Aktivierung einer Überbrückung über {element} ist nicht nachweisbar
      en: Activation of a bypass via {element} cannot be traced
    scenario:
      de: >-
        Überbrückungen, Freigaben und Betriebsartenwechsel werden per Software
        geschaltet, ohne dass Zeitpunkt, Auslöser und Zugangsweg festgehalten
        werden. Ein Angreifer oder Innentäter aktiviert eine Überbrückung und
        streitet dies nach einem Vorfall ab.
      en: >-
        Bypasses, enables and operating mode changes are switched by software
        without recording time, trigger and access path. An attacker or insider
        activates a bypass and denies it after an incident.
    consequence:
      de: >-
        Nach einem Unfall lässt sich nicht klären, wer die Schutzfunktion außer Kraft
        gesetzt hat; Wiederholungen werden nicht verhindert.
      en: >-
        After an accident it cannot be determined who disabled the protective
        function; recurrence is not prevented.
    environment: {interface: local, access: restricted}
    impact: 3
    safety_related: true
    cra_refs: [AI-I-2-l]
    attack_ics: [T0872]
    iec62443: [FR6, FR2]
    measures: [security-logging, log-protection, bypass-hardwired-key, time-synchronization]
    sources: ["generic OT threat knowledge"]

  - id: safety-output-mapping-disclosure
    rev: 1
    stride: [I]
    applies_to: [safety-relevant-outputs, plc]
    title:
      de: Offenlegung der Belegung sicherheitswirksamer Ausgänge von {element}
      en: Disclosure of the assignment of safety-effective outputs of {element}
    scenario:
      de: >-
        Aus mitgeschnittenen Prozessdaten, ausgelesenen Projekten oder frei
        zugänglichen Gerätebeschreibungen und Variablenlisten erkennt ein Angreifer,
        welches Bit eine Überbrückung, Freigabe oder Betriebsart steuert.
      en: >-
        From recorded process data, uploaded projects or freely accessible device
        descriptions and tag lists an attacker identifies which bit controls a
        bypass, enable or operating mode.
    consequence:
      de: >-
        Der Angreifer kann Schutzfunktionen gezielt und mit wenigen Telegrammen
        aushebeln.
      en: >-
        The attacker can defeat protective functions selectively with few telegrams.
    environment: {interface: local, access: restricted}
    impact: 2
    cra_refs: [AI-I-2-e]
    attack_ics: [T0861]
    iec62443: [FR4]
    measures: [engineering-project-protection, data-minimisation, safety-separation]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: output-hold-last-value
    rev: 1
    stride: [D, T]
    applies_to: [remote-io, safety-relevant-outputs, fieldbus-ethercat, fieldbus-profinet, fieldbus-canopen]
    title:
      de: Ausgänge von {element} behalten bei Kommunikationsausfall ihren Zustand
      en: Outputs of {element} keep their state on communication loss
    scenario:
      de: >-
        Das E/A-Modul ist so konfiguriert, dass Ausgänge bei Kommunikationsausfall
        den letzten Wert halten, oder ein Angreifer stellt diese Fehlerreaktion
        über Parameter um. Er setzt zuerst eine Freigabe oder Überbrückung und
        unterbricht dann die Kommunikation, sodass die Steuerung den Ausgang nicht
        mehr zurücknehmen kann.
      en: >-
        The I/O module is configured so that outputs hold their last value on
        communication loss, or an attacker changes this fault reaction via
        parameters. The attacker first sets an enable or bypass and then interrupts
        communication, so the controller can no longer reset the output.
    consequence:
      de: >-
        Eine Freigabe oder Überbrückung bleibt aktiv, obwohl die Steuerung keinen
        Einfluss mehr hat; Personen können gefährdet werden.
      en: >-
        An enable or bypass remains active although the controller has lost
        control; persons can be endangered.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-h, AI-I-2-f]
    attack_ics: [T0813, T0837]
    iec62443: [FR7, FR3]
    measures: [watchdog-safe-state, config-integrity-check, safety-separation]
    sources: ["generic OT threat knowledge"]

  # --- protective devices ------------------------------------------------------------
  - id: safety-device-signal-spoofed
    rev: 1
    stride: [S, T]
    applies_to: [safety-devices, remote-io]
    title:
      de: Vorgetäuschter Zustand der Schutzeinrichtung {element}
      en: Spoofed state of protective device {element}
    scenario:
      de: >-
        Der Zustand einer Schutzeinrichtung (z. B. Schutztür, Lichtgitter) wird
        zusätzlich oder ausschließlich über einen Standard-Eingang an die Steuerung
        gemeldet und dort für Freigaben verwendet. Ein Angreifer täuscht den Zustand
        über eingespeiste Telegramme oder ein manipuliertes E/A-Modul vor.
      en: >-
        The state of a protective device (e.g. guard door, light curtain) is
        reported additionally or exclusively via a standard input to the controller
        and used there for enables. An attacker spoofs the state via injected
        telegrams or a manipulated I/O module.
    consequence:
      de: >-
        Die Steuerung gibt gefahrbringende Bewegungen frei, obwohl die
        Schutzeinrichtung offen ist; Personen können verletzt werden.
      en: >-
        The controller enables hazardous movements although the protective device
        is open; persons can be injured.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-f, AI-I-2-d]
    attack_ics: [T1692, T0880]
    emb3d: [TID-406]
    iec62443: [FR3, FR1]
    measures: [safety-separation, safe-communication-profile, fieldbus-physical-protection]
    sources: ["generic OT threat knowledge"]

  - id: safety-reset-via-bus
    rev: 1
    stride: [S, R]
    applies_to: [safety-devices, safety-plc]
    title:
      de: Gefälschter Rücksetzbefehl für {element} über den Bus
      en: Forged reset command for {element} via the bus
    scenario:
      de: >-
        Die Quittierung nach Not-Halt oder Öffnen einer Schutzeinrichtung wird als
        Telegramm von einem Bediengerät oder einer Standardsteuerung übertragen.
        Ein Angreifer sendet den Rücksetzbefehl selbst, ohne Sicht auf den
        Gefahrenbereich, und der Befehl lässt sich keinem Bediener zuordnen.
      en: >-
        The acknowledgement after an emergency stop or opening of a protective
        device is transmitted as a telegram from an operator panel or standard
        controller. An attacker sends the reset command without view of the danger
        zone, and the command cannot be attributed to any operator.
    consequence:
      de: >-
        Die Maschine wird wieder anlauffähig, während sich eine Person im
        Gefahrenbereich befindet; die Herkunft des Befehls bleibt unklar.
      en: >-
        The machine becomes ready to start again while a person is in the danger
        zone; the origin of the command remains unclear.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-l]
    attack_ics: [T1692, T0880]
    iec62443: [FR1, FR6]
    measures: [local-control-priority, safety-separation, security-logging]
    sources: ["generic OT threat knowledge"]
