# Threat templates for the field level: fieldbuses, field devices, drives,
# controllers at the bus and the interface to safety functions.
threats:
  # --- fieldbus: authentication, topology, interception ------------------------
  - id: fieldbus-rogue-master
    rev: 1
    stride: [S, T]
    applies_to: [fieldbus-ethercat, fieldbus-canopen, fieldbus-modbus-rtu, plc]
    title:
      de: Fremder Master übernimmt den Feldbus {element}
      en: Rogue master takes over fieldbus {element}
    scenario:
      de: >-
        Der Feldbus kennt keine Authentisierung des Masters. Ein Angreifer schließt
        ein eigenes Gerät (z. B. Laptop mit Feldbus-Master-Software) an einen freien
        Anschluss an oder trennt die Steuerung ab und tritt selbst als Master auf.
        Die Slaves akzeptieren seine Telegramme wie die der regulären Steuerung.
      en: >-
        The fieldbus has no authentication of the master. An attacker connects
        their own device (e.g. a laptop with fieldbus master software) to a free
        connector, or disconnects the controller and acts as master. The slaves
        accept the attacker's telegrams just like those of the regular controller.
    consequence:
      de: >-
        Der Angreifer setzt Ausgänge, fährt Antriebe und ändert Parameter an der
        Steuerung vorbei. Bewegungen ohne Kontrolle der Maschinensteuerung können
        Personen gefährden.
      en: >-
        The attacker sets outputs, moves drives and changes parameters bypassing
        the controller. Movements outside the control of the machine controller
        can endanger persons.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-f]
    attack_ics: [T0848, T1692, T0831]
    emb3d: [TID-406]
    iec62443: [FR1, FR3]
    measures: [fieldbus-physical-protection, fieldbus-topology-monitoring, unused-ports-closed, safety-separation]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: fieldbus-device-inserted-mitm
    rev: 1
    stride: [T, I]
    applies_to: [fieldbus-ethercat, fieldbus-profinet, fieldbus-modbus-tcp, fieldbus-modbus-rtu, fieldbus-canopen, io-link]
    title:
      de: Eingeschleiftes Gerät manipuliert Telegramme auf {element}
      en: Device inserted into the line manipulates telegrams on {element}
    scenario:
      de: >-
        Ein Angreifer trennt die Leitung zwischen zwei Teilnehmern auf und schleift
        ein eigenes Gerät ein, das alle Telegramme mitliest und weiterleitet. Da
        die Telegramme weder signiert noch verschlüsselt sind, kann das Gerät
        Prozessdaten unbemerkt verändern, z. B. Sensorwerte zur Steuerung oder
        Sollwerte zu den Antrieben.
      en: >-
        An attacker cuts the line between two nodes and inserts their own device
        that reads and forwards all telegrams. Since telegrams are neither signed
        nor encrypted, the device can alter process data unnoticed, e.g. sensor
        values sent to the controller or set points sent to the drives.
    consequence:
      de: >-
        Die Steuerung arbeitet mit falschen Eingangsdaten oder die Aktoren erhalten
        verfälschte Befehle; gefährliche Bewegungen und Fehlproduktion sind möglich.
        Zusätzlich werden alle Prozessdaten offengelegt.
      en: >-
        The controller works with false input data or the actuators receive
        falsified commands; hazardous movements and faulty production are possible.
        In addition, all process data are disclosed.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-f, AI-I-2-e]
    attack_ics: [T0830, T0831]
    emb3d: [TID-406, TID-408]
    iec62443: [FR3, FR4]
    measures: [fieldbus-physical-protection, fieldbus-topology-monitoring, tamper-evident-seals, protocol-security-extension]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: fieldbus-open-port-end-of-line
    rev: 1
    stride: [I, T]
    applies_to: [fieldbus-ethercat, fieldbus-canopen, fieldbus-modbus-rtu]
    title:
      de: Offener Anschluss am Linienende von {element} gibt alle Telegramme preis
      en: Open port at the end of line {element} exposes all telegrams
    scenario:
      de: >-
        Am letzten Teilnehmer einer Linie oder an einem Abzweig bleibt ein
        Busanschluss frei. Bei Linientopologien wie EtherCAT laufen die Telegramme
        durch alle Teilnehmer, bei CAN und RS-485 sieht jeder Teilnehmer den ganzen
        Verkehr. Ein dort angeschlossenes Gerät empfängt sämtliche Telegramme und
        kann eigene einspeisen, ohne die Linie auftrennen zu müssen.
      en: >-
        A bus connector remains free at the last node of a line or at a branch.
        In line topologies such as EtherCAT telegrams pass through every node; on
        CAN and RS-485 every node sees all traffic. A device connected there
        receives all telegrams and can inject its own without cutting the line.
    consequence:
      de: >-
        Prozessdaten und Anlagenaufbau werden offengelegt und dienen als Grundlage
        für gezielte Manipulation; eingespeiste Telegramme können Aktoren beeinflussen.
      en: >-
        Process data and plant structure are disclosed and serve as basis for
        targeted manipulation; injected telegrams can influence actuators.
    environment: {interface: local, access: restricted}
    impact: 3
    cra_refs: [AI-I-2-j, AI-I-2-e]
    attack_ics: [T0842]
    emb3d: [TID-408]
    iec62443: [FR4, FR5]
    measures: [unused-ports-closed, fieldbus-physical-protection, fieldbus-topology-monitoring]
    sources: ["generic OT threat knowledge"]

  - id: fieldbus-process-data-sniffing
    rev: 1
    stride: [I]
    applies_to: [fieldbus-ethercat, fieldbus-profinet, fieldbus-modbus-tcp, fieldbus-modbus-rtu, fieldbus-canopen, io-link]
    title:
      de: Mitschneiden der Prozessdaten auf {element}
      en: Eavesdropping on process data on {element}
    scenario:
      de: >-
        Ein Angreifer mit Zugang zum Bus oder zum Netz (z. B. über einen
        Spiegel-Port, einen freien Anschluss oder ein kompromittiertes Gerät) zeichnet
        den unverschlüsselten Verkehr auf. Aus den Telegrammen lassen sich
        Prozesswerte, Rezeptparameter und die Belegung der Ein- und Ausgänge ableiten.
      en: >-
        An attacker with access to the bus or network (e.g. via a mirror port, a
        free connector or a compromised device) records the unencrypted traffic.
        Process values, recipe parameters and the I/O assignment can be derived
        from the telegrams.
    consequence:
      de: >-
        Verfahrens-Know-how geht verloren und der Angreifer erhält die Informationen,
        die er für gezielte Manipulationen benötigt.
      en: >-
        Process know-how is lost and the attacker obtains the information needed
        for targeted manipulation.
    environment: {interface: local, access: restricted}
    impact: 2
    cra_refs: [AI-I-2-e]
    attack_ics: [T0842]
    emb3d: [TID-408]
    iec62443: [FR4]
    measures: [fieldbus-physical-protection, network-segmentation, protocol-security-extension]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  # --- fieldbus: acyclic services, firmware, tunnels ---------------------------
  - id: fieldbus-mailbox-parameter-access
    rev: 1
    stride: [T, E]
    applies_to: [fieldbus-ethercat, fieldbus-profinet, fieldbus-canopen, drive, remote-io, smart-field-device]
    title:
      de: Parameteränderung über azyklische Dienste auf {element}
      en: Parameter change via acyclic services on {element}
    scenario:
      de: >-
        Neben den zyklischen Prozessdaten bieten Feldbusse azyklische Dienste für
        Parameterzugriffe, z. B. CoE-SDO bei EtherCAT, Record-Data bei PROFINET
        oder SDO bei CANopen. Diese Zugriffe sind nicht authentisiert. Wer Telegramme
        auf den Bus bringen kann, liest und schreibt damit beliebige Objekte im
        Gerät, auch solche, die nur zur Inbetriebnahme gedacht sind.
      en: >-
        Besides cyclic process data, fieldbuses offer acyclic services for
        parameter access, e.g. CoE SDO on EtherCAT, record data on PROFINET or
        SDO on CANopen. These accesses are not authenticated. Anyone able to put
        telegrams on the bus can read and write any object in the device, including
        those intended only for commissioning.
    consequence:
      de: >-
        Grenzwerte, Skalierungen, Prozessdatenzuordnung oder Fehlerreaktionen werden
        verändert; das Gerät verhält sich anders als von der Steuerung erwartet,
        bis hin zu gefährlichen Bewegungen.
      en: >-
        Limits, scaling, process data mapping or fault reactions are changed; the
        device behaves differently than the controller expects, up to hazardous
        movements.
    environment: {interface: local, access: restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-f, AI-I-2-j]
    attack_ics: [T0836, T1692]
    emb3d: [TID-310, TID-406]
    iec62443: [FR1, FR2, FR3]
    measures: [fieldbus-mailbox-restriction, parameter-plausibility, config-integrity-check, write-protection-switch]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: fieldbus-firmware-download
    rev: 1
    stride: [T, E]
    applies_to: [fieldbus-ethercat, fieldbus-profinet, fieldbus-canopen, drive, remote-io, smart-field-device]
    title:
      de: Manipulierte Firmware wird über {element} eingespielt
      en: Manipulated firmware is loaded via {element}
    scenario:
      de: >-
        Viele Feldgeräte nehmen neue Firmware direkt über den Feldbus an, z. B. per
        FoE (File over EtherCAT) oder herstellerspezifische Download-Dienste. Ist
        die Firmware nicht signiert oder wird die Signatur nicht geprüft, spielt ein
        Angreifer mit Buszugang eine veränderte Firmware ein, die dauerhaft im Gerät
        verbleibt.
      en: >-
        Many field devices accept new firmware directly via the fieldbus, e.g. via
        FoE (File over EtherCAT) or vendor-specific download services. If the
        firmware is not signed or the signature is not checked, an attacker with
        bus access loads modified firmware that persists in the device.
    consequence:
      de: >-
        Das Gerät führt beliebigen Code aus, meldet falsche Werte, ignoriert Befehle
        oder fällt dauerhaft aus. Die Manipulation überlebt Neustarts und ist von
        der Steuerung aus kaum erkennbar.
      en: >-
        The device executes arbitrary code, reports false values, ignores commands
        or fails permanently. The manipulation survives restarts and is hardly
        detectable from the controller.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-f, AI-I-2-d, AI-II-7]
    attack_ics: [T1693, T0800]
    emb3d: [TID-211, TID-213]
    iec62443: [FR3, FR1]
    measures: [signed-firmware, fieldbus-firmware-download-lock, secure-boot, anti-rollback]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20; MITRE EMB3D"]

  - id: ethercat-eoe-hidden-ip-path
    rev: 1
    stride: [E, T, I]
    applies_to: [fieldbus-ethercat, plc]
    title:
      de: EoE-Tunnel als verdeckter IP-Zugang zur Steuerung über {element}
      en: EoE tunnel as hidden IP path into the controller via {element}
    scenario:
      de: >-
        Ethernet over EtherCAT (EoE) überträgt IP-Verkehr im Mailbox-Kanal des
        Feldbusses. Der Master leitet diesen Verkehr an einen virtuellen Switch oder
        an das IP-Netz der Steuerung weiter. Ein Angreifer, der ein Gerät am Bus
        kontrolliert oder einen eigenen Teilnehmer anschließt, erreicht über diesen
        Tunnel Webserver, Engineering-Dienste und das Betriebssystem der Steuerung,
        vorbei an Firewall und Netzsegmentierung.
      en: >-
        Ethernet over EtherCAT (EoE) carries IP traffic in the fieldbus mailbox
        channel. The master forwards this traffic to a virtual switch or to the
        controller's IP network. An attacker controlling a bus device or connecting
        their own node reaches web servers, engineering services and the operating
        system of the controller through this tunnel, bypassing firewall and
        network segmentation.
    consequence:
      de: >-
        Der Feldbus wird zum Einfallstor in die Steuerungsebene; Programme und
        Konfiguration der Steuerung können verändert oder ausgelesen werden.
      en: >-
        The fieldbus becomes an entry point into the control level; controller
        programs and configuration can be modified or read.
    environment: {interface: local, access: restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-j, AI-I-2-d]
    attack_ics: [T0884]
    emb3d: [TID-412]
    iec62443: [FR5, FR1]
    measures: [fieldbus-tunnel-disabled, firewall-allowlist, least-privilege-services, network-segmentation]
    sources: ["generic OT threat knowledge; MITRE EMB3D"]

  - id: ethercat-sii-eeprom-manipulation
    rev: 1
    stride: [T]
    applies_to: [fieldbus-ethercat, remote-io, drive, smart-field-device]
    title:
      de: Manipulation der Gerätebeschreibung im EEPROM über {element}
      en: Manipulation of the device description in EEPROM via {element}
    scenario:
      de: >-
        EtherCAT-Slaves speichern Identität, Mailbox-Einstellungen und
        Prozessdatenbeschreibung in einem EEPROM (SII), das über den Bus beschreibbar
        ist. Ein Angreifer mit Buszugang überschreibt diese Daten, z. B. Hersteller-
        und Produktkennung oder die Prozessdatenzuordnung.
      en: >-
        EtherCAT slaves store identity, mailbox settings and process data
        description in an EEPROM (SII) that is writable via the bus. An attacker
        with bus access overwrites this data, e.g. vendor and product identifiers
        or the process data mapping.
    consequence:
      de: >-
        Das Gerät wird nach dem nächsten Hochlauf falsch eingebunden oder bringt
        den Bus nicht mehr in Betrieb; die Manipulation bleibt dauerhaft gespeichert.
      en: >-
        After the next start-up the device is integrated incorrectly or the bus no
        longer becomes operational; the manipulation persists.
    environment: {interface: local, access: restricted}
    impact: 3
    cra_refs: [AI-I-2-f]
    attack_ics: [T1692]
    emb3d: [TID-406]
    iec62443: [FR3]
    measures: [fieldbus-mailbox-restriction, config-integrity-check, fieldbus-topology-monitoring]
    sources: ["generic OT threat knowledge"]

  # --- protocol-specific -------------------------------------------------------
  - id: modbus-unauthenticated-write
    rev: 1
    stride: [T]
    applies_to: [fieldbus-modbus-tcp, fieldbus-modbus-rtu, plc, process-device]
    title:
      de: Unautorisiertes Schreiben von Coils und Registern über {element}
      en: Unauthorised write of coils and registers via {element}
    scenario:
      de: >-
        Modbus kennt weder Authentisierung noch Berechtigungen. Jeder Teilnehmer,
        der den Server über das Netz oder die serielle Leitung erreicht, kann mit
        Standardwerkzeugen Coils und Holding-Register beschreiben, etwa Freigaben,
        Sollwerte oder Betriebsbefehle.
      en: >-
        Modbus has neither authentication nor authorisation. Any party that can
        reach the server via the network or the serial line can write coils and
        holding registers with standard tools, such as enables, set points or
        operating commands.
    consequence:
      de: >-
        Der Prozess wird gezielt verstellt oder Aktoren werden ausgelöst; je nach
        Belegung der Register sind gefährliche Zustände möglich.
      en: >-
        The process is deliberately misadjusted or actuators are triggered;
        depending on the register assignment hazardous states are possible.
    environment: {interface: known_network, access: restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-f]
    attack_ics: [T1692, T0836, T0831]
    emb3d: [TID-310, TID-406]
    iec62443: [FR1, FR2, FR3]
    measures: [firewall-allowlist, network-segmentation, parameter-plausibility, protocol-security-extension]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: modbus-tcp-connection-exhaustion
    rev: 1
    stride: [D]
    applies_to: [fieldbus-modbus-tcp, process-device, remote-io]
    title:
      de: Erschöpfung der Modbus-TCP-Verbindungen von {element}
      en: Exhaustion of Modbus TCP connections of {element}
    scenario:
      de: >-
        Modbus-TCP-Geräte erlauben meist nur wenige gleichzeitige Verbindungen. Ein
        Angreifer im Netz öffnet diese Verbindungen und hält sie offen, sodass die
        Steuerung keine Verbindung mehr aufbauen kann.
      en: >-
        Modbus TCP devices usually allow only a few simultaneous connections. An
        attacker in the network opens these connections and keeps them open, so the
        controller can no longer connect.
    consequence:
      de: >-
        Die Kommunikation zwischen Steuerung und Gerät fällt aus; die Maschine
        stoppt oder läuft ohne aktuelle Werte weiter.
      en: >-
        Communication between controller and device fails; the machine stops or
        continues without current values.
    environment: {interface: known_network, access: restricted}
    impact: 3
    cra_refs: [AI-I-2-h]
    attack_ics: [T0814]
    emb3d: [TID-405]
    iec62443: [FR7, FR5]
    measures: [firewall-allowlist, dos-rate-limiting, network-segmentation, watchdog-safe-state]
    sources: ["generic OT threat knowledge"]

  - id: profinet-dcp-reconfiguration
    rev: 1
    stride: [T, D]
    applies_to: [fieldbus-profinet, remote-io, drive]
    title:
      de: Umbenennung oder Neuadressierung von Geräten über DCP auf {element}
      en: Renaming or readdressing devices via DCP on {element}
    scenario:
      de: >-
        Das Discovery and Configuration Protocol (DCP) von PROFINET ist ohne
        Security-Klasse nicht authentisiert. Ein Angreifer im selben Netzsegment
        ändert damit Gerätenamen oder IP-Adressen von Teilnehmern oder setzt sie
        auf Werkseinstellungen zurück.
      en: >-
        The PROFINET Discovery and Configuration Protocol (DCP) is not
        authenticated without a security class. An attacker in the same network
        segment uses it to change device names or IP addresses of nodes, or resets
        them to factory settings.
    consequence:
      de: >-
        Die Steuerung verliert die Verbindung zu den betroffenen Geräten und die
        Maschine stoppt; im ungünstigen Fall wird ein falsches Gerät unter dem
        erwarteten Namen eingebunden.
      en: >-
        The controller loses connection to the affected devices and the machine
        stops; in the worst case a wrong device is integrated under the expected name.
    environment: {interface: dedicated_known_network, access: restricted}
    impact: 3
    cra_refs: [AI-I-2-d, AI-I-2-h]
    attack_ics: [T1692, T0814]
    emb3d: [TID-310]
    iec62443: [FR1, FR7]
    measures: [network-segmentation, protocol-security-extension, write-protection-switch, network-monitoring-ids]
    sources: ["generic OT threat knowledge"]

  - id: canopen-nmt-stop
    rev: 1
    stride: [D, T]
    applies_to: [fieldbus-canopen]
    title:
      de: Netzwerkmanagement-Befehle stoppen oder setzen Knoten auf {element} zurück
      en: Network management commands stop or reset nodes on {element}
    scenario:
      de: >-
        CANopen-NMT-Befehle wie Stop, Reset Node oder Reset Communication sind nicht
        authentisiert und können an alle Knoten gleichzeitig gesendet werden. Ein
        Angreifer mit Zugang zum CAN-Bus sendet diese Befehle wiederholt.
      en: >-
        CANopen NMT commands such as stop, reset node or reset communication are
        not authenticated and can be broadcast to all nodes. An attacker with access
        to the CAN bus sends these commands repeatedly.
    consequence:
      de: >-
        Antriebe und E/A-Module verlassen den Betriebszustand, die Maschine steht
        still; nach einem Reset können Parameter auf Standardwerte zurückfallen.
      en: >-
        Drives and I/O modules leave the operational state and the machine stops;
        after a reset parameters may fall back to default values.
    environment: {interface: local, access: restricted}
    impact: 3
    cra_refs: [AI-I-2-h, AI-I-2-d]
    attack_ics: [T1692, T0816, T0814]
    emb3d: [TID-406]
    iec62443: [FR7, FR1]
    measures: [fieldbus-physical-protection, fieldbus-topology-monitoring, watchdog-safe-state]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: canopen-pdo-injection
    rev: 1
    stride: [S, T]
    applies_to: [fieldbus-canopen, remote-io, smart-field-device]
    title:
      de: Eingespeiste Prozessdaten-Telegramme auf {element}
      en: Injected process data telegrams on {element}
    scenario:
      de: >-
        Auf dem CAN-Bus wird der Absender eines Telegramms nur über den Identifier
        bestimmt. Ein Angreifer sendet Prozessdaten-Telegramme (PDO) mit dem
        Identifier eines Sensors oder E/A-Moduls und überlagert so die echten Werte.
      en: >-
        On the CAN bus the sender of a telegram is only identified by its
        identifier. An attacker sends process data telegrams (PDO) with the
        identifier of a sensor or I/O module and thus overrides the genuine values.
    consequence:
      de: >-
        Die Steuerung reagiert auf vorgetäuschte Eingänge, z. B. Endlagen oder
        Füllstände; Fehlfunktionen und gefährliche Bewegungen sind möglich.
      en: >-
        The controller reacts to spoofed inputs, e.g. end positions or fill
        levels; malfunctions and hazardous movements are possible.
    environment: {interface: local, access: restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-f, AI-I-2-d]
    attack_ics: [T1692, T0832]
    emb3d: [TID-406]
    iec62443: [FR3, FR1]
    measures: [fieldbus-physical-protection, parameter-plausibility, fieldbus-topology-monitoring]
    sources: ["generic OT threat knowledge"]

  # --- IO-Link -----------------------------------------------------------------
  - id: io-link-parameter-manipulation
    rev: 1
    stride: [T]
    applies_to: [io-link, smart-field-device]
    title:
      de: Manipulation von Sensorparametern über {element}
      en: Manipulation of sensor parameters via {element}
    scenario:
      de: >-
        IO-Link-Geräte werden über ihren Master ohne Authentisierung parametriert.
        Ein Angreifer mit Zugriff auf den Master (z. B. über dessen Webserver,
        Feldbus-Zugang oder ein angeschlossenes Parametriertool) ändert Schaltpunkte,
        Filterzeiten, Messbereiche oder Teach-Werte eines Sensors.
      en: >-
        IO-Link devices are parameterised via their master without authentication.
        An attacker with access to the master (e.g. via its web server, fieldbus
        access or a connected parameterisation tool) changes switching points,
        filter times, measuring ranges or teach values of a sensor.
    consequence:
      de: >-
        Der Sensor schaltet zu spät, gar nicht oder dauerhaft; Prozessfehler und bei
        Positions- oder Präsenzerkennung gefährliche Situationen sind möglich.
      en: >-
        The sensor switches too late, not at all or permanently; process errors
        and, for position or presence detection, hazardous situations are possible.
    environment: {interface: local, access: public_restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-f]
    attack_ics: [T0836]
    emb3d: [TID-310]
    iec62443: [FR1, FR3]
    measures: [write-protection-switch, config-integrity-check, parameter-plausibility, role-based-access]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: io-link-data-storage-propagation
    rev: 1
    stride: [T]
    applies_to: [io-link, smart-field-device]
    title:
      de: Data-Storage verteilt manipulierte Parameter über {element}
      en: Data storage propagates manipulated parameters via {element}
    scenario:
      de: >-
        Der IO-Link-Master sichert die Parameter angeschlossener Geräte (Data
        Storage) und überträgt sie beim Gerätetausch automatisch auf das neue Gerät.
        Hat ein Angreifer die Parameter einmal verändert, wird der manipulierte
        Stand bei jedem Tausch wiederhergestellt und überdauert so die Fehlersuche.
      en: >-
        The IO-Link master backs up the parameters of connected devices (data
        storage) and automatically transfers them to a replacement device. Once an
        attacker has changed the parameters, the manipulated set is restored on
        every replacement and thus survives troubleshooting.
    consequence:
      de: >-
        Fehlfunktionen treten nach dem Gerätetausch erneut auf; die Ursache wird
        lange nicht erkannt.
      en: >-
        Malfunctions reappear after device replacement; the cause remains
        undetected for a long time.
    environment: {interface: local, access: public_restricted}
    impact: 3
    cra_refs: [AI-I-2-f]
    attack_ics: [T0836]
    iec62443: [FR3]
