title: Genuine spare parts from trusted sources
description: Spare parts for controller, drives and electronics are sourced only from the manufacturer or authorised distributors. At goods receipt, packaging, labelling and firmware version are checked; before installation the firmware is brought to an approved version. The operating manual points the operator to these sources.
