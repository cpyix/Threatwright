# Organisational, design, supply chain and user information measures.
measures:
  - id: support-period-defined
    rev: 1
    title:
      de: Festgelegter und veröffentlichter Unterstützungszeitraum
      en: Defined and published support period
    description:
      de: >-
        Der Hersteller legt fest, wie lange das Produkt Sicherheitsupdates erhält, und
        nennt diesen Zeitraum vor dem Kauf gut sichtbar. Der Zeitraum entspricht der
        erwarteten Nutzungsdauer, mindestens aber den Vorgaben des CRA. Budget und
        Personal für die Pflege sind für diesen Zeitraum eingeplant.
      en: >-
        The manufacturer determines how long the product receives security updates and
        states this period clearly before purchase. The period matches the expected
        lifetime, but at least the CRA requirements. Budget and staff for maintenance
        are planned for this period.
    kind: organizational
    evidence:
      de: Produktseite oder Verpackung mit Unterstützungszeitraum; Wartungsplan.
      en: Product page or packaging with support period; maintenance plan.
    cra_refs: [AI-I-2-c, Art13, AII]
    etsi303645: ['5.3-13', '5.3-16']
    sources: ["Regulation (EU) 2024/2847 Art. 13; ETSI EN 303 645 V3.1.3 provision 5.3-13"]

  - id: vuln-disclosure-policy
    rev: 1
    title:
      de: Veröffentlichte Meldestelle für Schwachstellen
      en: Published vulnerability reporting contact
    description:
      de: >-
        Eine Kontaktadresse für Schwachstellen (z. B. security.txt und Webseite) und
        Regeln zur koordinierten Offenlegung sind veröffentlicht. Meldungen werden
        bestätigt, bewertet und in festgelegten Fristen behoben; der Melder erfährt den
        Stand.
      en: >-
        A contact address for vulnerabilities (e.g. security.txt and website) and rules
        for coordinated disclosure are published. Reports are acknowledged, assessed and
        fixed within defined time limits; the reporter is kept informed.
    kind: organizational
    evidence:
      de: Veröffentlichte Richtlinie; Ticket-Verlauf einer Testmeldung.
      en: Published policy; ticket history of a test report.
    cra_refs: [AI-II-5, AI-II-6]
    etsi303645: ['5.2-1', '5.2-2']
    sources: ["ETSI EN 303 645 V3.1.3 provision 5.2; TR-03183-1 Annex B"]

  - id: sbom-maintained
    rev: 1
    title:
      de: Gepflegte Komponentenliste (SBOM) und Schwachstellenüberwachung
      en: Maintained component list (SBOM) and vulnerability monitoring
    description:
      de: >-
        Für Firmware, App und Cloud-Dienste wird bei jedem Build eine maschinenlesbare
        Liste aller Fremdkomponenten mit Version erzeugt. Ein Werkzeug gleicht sie
        laufend mit Schwachstellendatenbanken ab, und Funde werden wie eigene
        Schwachstellen behandelt. Zulieferer sind vertraglich verpflichtet, Schwachstellen
        zu melden.
      en: >-
        For firmware, app and cloud services a machine-readable list of all third-party
        components with version is generated at every build. A tool continuously
        compares it with vulnerability databases, and findings are handled like own
        vulnerabilities. Suppliers are contractually obliged to report vulnerabilities.
    kind: supply_chain
    evidence:
      de: SBOM der aktuellen Version; Bericht der Schwachstellenprüfung.
      en: SBOM of the current version; vulnerability check report.
    cra_refs: [AI-II-1, AI-I-2-a]
    etsi303645: ['5.2-3']
    masvs: [MASVS-CODE-3]
    sources: ["TR-03183-1 Annex B; ETSI EN 303 645 V3.1.3 provision 5.2-3"]

  - id: radio-loss-safe-state
    rev: 1
    title:
      de: Sicheres Verhalten bei Verbindungsverlust
      en: Safe behaviour on loss of connection
    description:
      de: >-
        Für jede Funktion ist festgelegt, wie sich das Gerät ohne Funk- oder
        Cloud-Verbindung verhält, z. B. Heizung auf Frostschutz, Schloss bleibt
        verriegelt und manuell bedienbar, Alarmanlage meldet den Ausfall. Das Verhalten
        wird getestet und dem Nutzer erklärt.
      en: >-
        For each function it is defined how the device behaves without radio or cloud
        connection, e.g. heating at frost protection, lock stays locked and manually
        operable, alarm system reports the failure. The behaviour is tested and
        explained to the user.
    kind: design
    evidence:
      de: Verhaltensbeschreibung je Funktion; Testprotokoll mit Störsender.
      en: Behaviour description per function; test record with jammer.
    cra_refs: [AI-I-2-h]
    etsi303645: ['5.9-1']
    sources: ["ETSI EN 303 645 V3.1.3 provision 5.9-1"]

  - id: secure-setup-guide
    rev: 1
    title:
      de: Verständliche Anleitung zur sicheren Einrichtung
      en: Understandable guide to secure setup
    description:
      de: >-
        Kurzanleitung und App führen den Nutzer in wenigen Schritten zu einer sicheren
        Einrichtung: eigenes Passwort, Updates aktiv, Freigaben prüfen. Sie erklären, wie
        man Zugangsdaten ändert und den Sicherheitsstand prüft.
      en: >-
        Quick guide and app lead the user to a secure setup in a few steps: own
        password, updates active, review shares. They explain how to change credentials
        and check the security status.
    kind: user_information
    evidence:
      de: Kurzanleitung; Einrichtungsablauf in der App.
      en: Quick guide; setup flow in the app.
    cra_refs: [AII]
    etsi303645: ['5.1-4', '5.12-2', '5.12-3']
    sources: ["ETSI EN 303 645 V3.1.3 provisions 5.1-4 and 5.12"]

  - id: privacy-information
    rev: 1
    title:
      de: Klare Information über persönliche Daten
      en: Clear information about personal data
    description:
      de: >-
        Der Nutzer erfährt in einfacher Sprache, welche Daten Gerät, App und Cloud
        erheben, wozu und an wen sie gehen, wie er Telemetrie abschaltet und wie er vor
        Verkauf oder Rückgabe alle Daten löscht. Einwilligungen lassen sich in der App
        widerrufen.
      en: >-
        The user learns in plain language which data device, app and cloud collect, for
        what purpose and to whom it goes, how to switch off telemetry and how to delete
        all data before sale or return. Consents can be withdrawn in the app.
    kind: user_information
    evidence:
      de: Datenschutzhinweis; Anleitung zum Löschen.
      en: Privacy notice; deletion instructions.
    cra_refs: [AII, AI-I-2-g]
    etsi303645: ['6-1', '6-3A', '6-5', '5.11-3']
    masvs: [MASVS-PRIVACY-3]
    sources: ["ETSI EN 303 645 V3.1.3 clause 6 and provision 5.11-3"]
