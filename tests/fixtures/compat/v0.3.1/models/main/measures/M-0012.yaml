title: Device-specific credentials
description: Each machine or device receives individual passwords, keys and certificates during production that cannot be derived from the serial number or other public data. Shared credentials across a product series are not permitted. Initial credentials are handed over to the operator through a secure channel.
library_ref: lib:ot/measure/unique-device-credentials@1
kind: technical
evidence: Production instruction for generating credentials, sample check of two devices with different credentials.
