title: Priority of local control
description: Operation at the machine always takes precedence over commands from control system, cloud or remote access. Local stop and emergency stop functions work independently of network connections. While local operation is active, remote commands that trigger motion are blocked.
library_ref: lib:ot/measure/local-control-priority@1
kind: design
evidence: Functional description of control authority, test report with competing commands.
