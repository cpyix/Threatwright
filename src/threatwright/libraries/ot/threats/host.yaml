  - id: service-laptop-carrier
    rev: 1
    stride: [S, T]
    applies_to: [service-laptop, engineering-workstation]
    title:
      de: Infizierter {element} trägt Schadsoftware von Kunde zu Kunde
      en: Infected {element} carries malware from customer to customer
    scenario:
      de: >-
        Der Service-Laptop wird nacheinander an Maschinen verschiedener Kunden
        und im Büronetz betrieben. Er wird an einem Standort infiziert und beim
        nächsten Einsatz als vertrauenswürdiges Servicegerät direkt in das
        Maschinennetz gesteckt, an Firewalls und Netztrennung vorbei.
      en: >-
        The service laptop is used successively at machines of different
        customers and in the office network. It becomes infected at one site
        and, at the next assignment, is plugged directly into the machine
        network as a trusted service device, bypassing firewalls and
        segmentation.
    consequence:
      de: >-
        Schadsoftware verbreitet sich über viele Anlagen und Kunden. Der
        Hersteller wird selbst zum Verbreitungsweg.
      en: >-
        Malware spreads across many plants and customers. The manufacturer
        itself becomes the distribution channel.
