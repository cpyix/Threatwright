title: Hardening of the remote maintenance jump host
description: "The manufacturer's central access server or remote maintenance portal is operated in a hardened state: current patches, only required services, multi-factor login, separate administration access and monitoring. Service technicians reach machines only through this path, not directly from their laptops."
