# Threat templates for controller hosts, operation, data and lifecycle.
threats:
  # --- firmware, software and supply chain ---------------------------------------
  - id: firmware-no-signature-check
    rev: 1
    stride: [T, E]
    applies_to: [ipc-linux, ipc-windows, hmi, mobile-panel, vision-system, plc, drive, remote-io, smart-field-device]
    title:
      de: Manipulierte Firmware oder Software wird auf {element} installiert
      en: Manipulated firmware or software is installed on {element}
    scenario:
      de: >-
        {element} prüft beim Update und beim Start keine digitale Signatur der
        Firmware oder Software. Ein Angreifer mit Zugang zum Update-Weg (USB,
        Engineering-Tool, Netzwerk) spielt ein verändertes Image ein, das eine
        Hintertür oder geänderte Steuerungslogik enthält. Das Gerät akzeptiert
        das Image, weil es nur Format und Prüfsumme kontrolliert.
      en: >-
        {element} does not verify a digital signature of its firmware or
        software during update and boot. An attacker with access to the update
        path (USB, engineering tool, network) installs a modified image that
        contains a backdoor or altered control logic. The device accepts the
        image because it only checks format and checksum.
    consequence:
      de: >-
        Der Angreifer kontrolliert das Gerät dauerhaft, auch nach Neustart und
        Neuladen des Anwenderprogramms. Fehlfunktionen können Maschinenbewegungen
        auslösen und Personen gefährden.
      en: >-
        The attacker gains persistent control of the device, surviving restarts
        and reloading of the user program. Malfunctions can trigger machine
        movements and endanger persons.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-f, AI-II-7]
    attack_ics: [T1693]
    emb3d: [TID-211, TID-213, TID-201]
    iec62443: [FR3]
    measures: [signed-firmware, secure-boot, signed-updates]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20; MITRE EMB3D"]

  - id: firmware-rollback
    rev: 1
    stride: [T]
    applies_to: [ipc-linux, hmi, vision-system, mobile-panel, plc, drive]
    title:
      de: Rückspielen einer alten, verwundbaren Firmware auf {element}
      en: Downgrade of {element} to an old, vulnerable firmware
    scenario:
      de: >-
        {element} akzeptiert auch ältere, korrekt signierte Firmware-Stände. Ein
        Angreifer spielt gezielt eine Version mit bekannter, bereits behobener
        Schwachstelle ein und nutzt diese anschließend aus.
      en: >-
        {element} also accepts older, correctly signed firmware versions. An
        attacker deliberately installs a version with a known, already fixed
        vulnerability and then exploits it.
    consequence:
      de: >-
        Bereits verteilte Sicherheitsupdates werden wirkungslos, der Angreifer
        erlangt über die alte Schwachstelle die Kontrolle über das Gerät.
      en: >-
        Security updates already rolled out become ineffective; the attacker
        gains control of the device through the old vulnerability.
    environment: {interface: local, access: restricted}
    impact: 4
    safety_related: false
    cra_refs: [AI-I-2-c, AI-I-2-f]
    attack_ics: [T1693]
    emb3d: [TID-216]
    iec62443: [FR3]
    measures: [anti-rollback, signed-firmware]
    sources: ["generic OT threat knowledge; MITRE EMB3D"]

  - id: counterfeit-spare-parts
    rev: 1
    stride: [S, T]
    applies_to: [plc, drive, remote-io, smart-field-device, ipc-linux, ipc-windows, hmi, mobile-panel, vision-system]
    title:
      de: Gefälschtes oder manipuliertes Ersatzteil als {element} eingebaut
      en: Counterfeit or manipulated spare part installed as {element}
    scenario:
      de: >-
        Bei einer Reparatur wird ein Ersatzgerät aus einer nicht autorisierten
        Bezugsquelle eingebaut, etwa einem Online-Marktplatz. Das Gerät gibt sich
        als Originalteil aus, enthält aber veränderte Firmware oder zusätzliche
        Hardware. Die Maschine erkennt den Tausch nicht und vertraut dem Gerät
        wie dem Original.
      en: >-
        During a repair, a replacement device from an unauthorised source, for
        example an online marketplace, is installed. The device poses as a
        genuine part but contains modified firmware or additional hardware. The
        machine does not detect the exchange and trusts the device like the
        original.
    consequence:
      de: >-
        Verdeckte Fehlfunktion, Datenabfluss oder ein dauerhafter Zugang für
        Dritte. Fehlerhafte Ansteuerung kann Personen gefährden.
      en: >-
        Hidden malfunction, data leakage or a persistent access for third
        parties. Faulty control can endanger persons.
    environment: {interface: physical, access: restricted, user: skilled}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-f, AI-II-1]
    attack_ics: [T0862]
    iec62443: [FR3]
    measures: [genuine-spare-parts, supplier-security-requirements, tamper-evident-seals, service-personnel-training]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: supplier-component-firmware
    rev: 1
    stride: [T, E]
    applies_to: [ipc-linux, ipc-windows, hmi, mobile-panel, vision-system, plc, drive, remote-io, smart-field-device]
    title:
      de: Zulieferkomponente mit eigener, ungeprüfter Firmware in {element}
      en: Supplier component with its own unreviewed firmware in {element}
    scenario:
      de: >-
        {element} enthält zugekaufte Baugruppen mit eigener Firmware, etwa ein
        Funkmodul, einen Kamerasensor, einen Feldbus-Controller oder ein
        Mainboard mit BIOS. Diese Firmware ist nicht in der Komponentenliste
        erfasst, wird nicht aktualisiert und enthält bekannte Schwachstellen
        oder undokumentierte Servicezugänge. Ein Angreifer nutzt diese
        Schwachstellen, um unterhalb der Kontrolle des Herstellers Code
        auszuführen.
      en: >-
        {element} contains purchased modules with their own firmware, such as a
        radio module, a camera sensor, a fieldbus controller or a mainboard with
        BIOS. This firmware is not recorded in the component inventory, is not
        updated and contains known vulnerabilities or undocumented service
        access. An attacker exploits these weaknesses to run code below the
        manufacturer's control.
    consequence:
      de: >-
        Schwachstellen bleiben unbemerkt und unbehoben. Der Angreifer kann das
        Gerät verdeckt manipulieren, auch wenn die eigene Software des
        Herstellers abgesichert ist.
      en: >-
        Vulnerabilities remain unnoticed and unfixed. The attacker can manipulate
        the device covertly even if the manufacturer's own software is
        hardened.
    impact: 4
    safety_related: false
    cra_refs: [AI-II-1, AI-I-2-a, AI-I-2-c]
    attack_ics: [T0862]
    emb3d: [TID-113]
    iec62443: [FR3]
    measures: [component-inventory-sbom, third-party-firmware-review, supplier-vulnerability-monitoring, supplier-security-requirements]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20; MITRE EMB3D"]

  - id: debug-interface-open
    rev: 1
    stride: [T, I, E]
    applies_to: [ipc-linux, hmi, vision-system, mobile-panel, plc]
    title:
      de: Offene Debug- oder Konsolenschnittstelle an {element}
      en: Open debug or console interface on {element}
    scenario:
      de: >-
        Auf der Platine oder am Gehäuse von {element} ist eine Debug-Schnittstelle
        (JTAG, serielle Konsole, Bootloader-Menü) zugänglich und im Feld nicht
        deaktiviert. Eine Person mit kurzem physischem Zugang schließt einen
        Adapter an, erhält eine Root-Konsole oder liest den Speicher aus und
        verändert Firmware oder Konfiguration.
      en: >-
        A debug interface (JTAG, serial console, bootloader menu) on the board
        or housing of {element} is accessible and not disabled in the field. A
        person with brief physical access connects an adapter, obtains a root
        console or reads out the memory and alters firmware or configuration.
    consequence:
      de: >-
        Vollständige Kontrolle über das Gerät, Abfluss von Schlüsseln und
        Programm-Know-how sowie Umgehung aller Software-Schutzmaßnahmen.
      en: >-
        Full control of the device, leakage of keys and program know-how, and
        bypass of all software protection.
    environment: {interface: physical, access: public_restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-j, AI-I-2-d]
    emb3d: [TID-119, TID-115]
    iec62443: [FR1, FR3]
    measures: [debug-interfaces-disabled, physical-access-control, tamper-evident-seals, tamper-alarm]
    sources: ["generic OT threat knowledge; MITRE EMB3D"]

  # --- credentials and access --------------------------------------------------------
  - id: default-credentials-fleet
    rev: 1
    stride: [S, E]
    applies_to: [ipc-linux, ipc-windows, soft-plc, hmi, mobile-panel, vision-system, engineering-workstation, plc]
    title:
      de: Standardpasswort oder flottenweit identische Zugangsdaten an {element}
      en: Default password or fleet-wide identical credentials on {element}
    scenario:
      de: >-
        {element} wird mit einem Standardpasswort ausgeliefert, oder alle
        Maschinen einer Baureihe verwenden dieselben Zugangsdaten für Service-
        und Administratorkonten. Die Daten stehen in Handbüchern, sind in der
        Software fest hinterlegt oder unter Servicetechnikern bekannt. Ein
        Angreifer meldet sich damit als berechtigter Benutzer an.
      en: >-
        {element} ships with a default password, or all machines of a series
        use the same credentials for service and administrator accounts. The
        credentials are printed in manuals, hard-coded in the software or known
        among service technicians. An attacker logs in as an authorised user.
    consequence:
      de: >-
        Administrativer Zugriff auf eine einzelne Maschine bedeutet Zugriff auf
        die gesamte Flotte. Der Angreifer kann Programme, Parameter und
        Sicherheitseinstellungen ändern und damit Personen gefährden.
      en: >-
        Administrative access to one machine means access to the whole fleet.
        The attacker can change programs, parameters and security settings and
        thereby endanger persons.
    environment: {interface: known_network, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-b, AI-I-2-d]
    attack_ics: [T1694, T0859]
    emb3d: [TID-311, TID-328]
    iec62443: [FR1]
    measures: [unique-device-credentials, no-default-passwords, strong-authentication]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20; MITRE EMB3D"]

  - id: secrets-cleartext
    rev: 1
    stride: [I, S]
    applies_to: [ipc-linux, ipc-windows, soft-plc, hmi, mobile-panel, vision-system, engineering-workstation, key-store, license-server]
    title:
      de: Passwörter und Schlüssel im Klartext auf {element}
      en: Passwords and keys stored in clear text on {element}
    scenario:
      de: >-
        {element} speichert Passwörter, private Schlüssel oder Zugangsdaten für
        Steuerungen, Datenbanken und Cloud-Dienste unverschlüsselt in
        Konfigurationsdateien, Projektdateien oder im Dateisystem. Ein Angreifer
        mit Lesezugriff, etwa über eine Sicherungskopie, einen ausgebauten
        Datenträger oder eine Schwachstelle, liest die Geheimnisse aus.
      en: >-
        {element} stores passwords, private keys or credentials for controllers,
        databases and cloud services unencrypted in configuration files, project
        files or the file system. An attacker with read access, for example via
        a backup, a removed storage medium or a vulnerability, reads the
        secrets.
    consequence:
      de: >-
        Der Angreifer meldet sich mit den erbeuteten Daten an weiteren Systemen
        an und gibt sich als legitimer Benutzer oder Dienst aus.
      en: >-
        The attacker uses the captured secrets to log in to further systems and
        impersonates a legitimate user or service.
    environment: {interface: local, access: restricted}
    impact: 4
    safety_related: false
    cra_refs: [AI-I-2-e, AI-I-2-d]
    attack_ics: [T0859]
    emb3d: [TID-329, TID-328]
    iec62443: [FR1, FR4]
    measures: [secrets-protected-storage, data-encryption-rest, role-based-access]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20; MITRE EMB3D"]

  - id: ews-stored-credentials-reuse
    rev: 1
    stride: [S]
    applies_to: [engineering-workstation, service-laptop]
    title:
      de: Gespeicherte Steuerungszugänge auf {element} werden missbraucht
      en: Controller credentials stored on {element} are misused
    scenario:
      de: >-
        Das Engineering-Tool auf {element} merkt sich Passwörter und Zertifikate
        für alle betreuten Steuerungen. Ein Angreifer, der den Rechner etwa über
        einen präparierten E-Mail-Anhang übernommen hat, nutzt diese Zugänge
        und meldet sich als Inbetriebnehmer an den Steuerungen an.
      en: >-
        The engineering tool on {element} remembers passwords and certificates
        for all controllers it serves. An attacker who has taken over the
        computer, for example through a crafted e-mail attachment, uses these
        credentials and logs in to the controllers as the commissioning
        engineer.
    consequence:
      de: >-
        Die Steuerungen können legitime von missbräuchlichen Zugriffen nicht
        unterscheiden. Programme und Parameter lassen sich unbemerkt ändern.
      en: >-
        The controllers cannot distinguish legitimate from malicious access.
        Programs and parameters can be changed unnoticed.
    environment: {interface: known_network, access: restricted, user: skilled}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-e]
    attack_ics: [T0859]
    iec62443: [FR1]
    measures: [secrets-protected-storage, strong-authentication, role-based-access]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: shared-service-accounts
    rev: 1
    stride: [R]
    applies_to: [service-laptop, engineering-workstation, hmi, ipc-linux, ipc-windows]
    title:
      de: Gemeinsame Servicekonten machen Eingriffe über {element} unzurechenbar
      en: Shared service accounts make interventions via {element} unattributable
    scenario:
      de: >-
        Alle Servicetechniker und Inbetriebnehmer verwenden dasselbe Konto, um
        über {element} Änderungen an Maschinen vorzunehmen. Ein Innentäter oder
        ein Angreifer mit diesen Zugangsdaten nimmt eine schädliche Änderung
        vor und bestreitet anschließend, beteiligt gewesen zu sein.
      en: >-
        All service technicians and commissioning engineers use the same account
        to change machines via {element}. An insider or an attacker with these
        credentials makes a harmful change and then denies involvement.
    consequence:
      de: >-
        Änderungen lassen sich keiner Person zuordnen. Ursachenanalyse,
        Haftungsklärung und Meldung eines Vorfalls werden erheblich erschwert.
      en: >-
        Changes cannot be attributed to a person. Root cause analysis,
        clarification of liability and incident reporting become considerably
        harder.
    impact: 3
    safety_related: false
    cra_refs: [AI-I-2-d, AI-I-2-l]
    attack_ics: [T0859]
    iec62443: [FR1, FR2]
    measures: [role-based-access, strong-authentication, security-logging]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: privilege-escalation-linux
    rev: 1
    stride: [E]
    applies_to: [ipc-linux, soft-plc]
    title:
      de: Rechteausweitung zu Root auf dem Linux-Steuerungsrechner {element}
      en: Privilege escalation to root on the Linux industrial PC {element}
    scenario:
      de: >-
        Ein Angreifer verfügt über ein Benutzerkonto mit geringen Rechten, etwa
        über einen Webdienst oder ein Bedienerkonto. Er nutzt eine
        Kernel-Schwachstelle, ein falsch gesetztes sudo- oder SUID-Recht oder
        einen Dienst, der unnötig als root läuft, und erlangt
        Administratorrechte. Häufig läuft auch die Echtzeit-Laufzeitumgebung
        mit root-Rechten.
      en: >-
        An attacker holds a low-privileged account, for example through a web
        service or an operator account. He exploits a kernel vulnerability, a
        misconfigured sudo or SUID permission or a service unnecessarily running
        as root and gains administrator rights. The real-time runtime often also
        runs as root.
    consequence:
      de: >-
        Volle Kontrolle über Betriebssystem, Steuerungsprogramm und
        Feldbusanbindung, einschließlich direkter Ansteuerung von Aktoren.
      en: >-
        Full control of the operating system, the control program and the
        fieldbus connection, including direct control of actuators.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-k]
    attack_ics: [T0890]
    emb3d: [TID-219, TID-204]
    iec62443: [FR2, FR3]
    measures: [least-privilege-services, os-hardening, patch-management-os, exploit-mitigations]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20; MITRE EMB3D"]

  - id: privilege-escalation-windows
    rev: 1
    stride: [E]
    applies_to: [ipc-windows, hmi, engineering-workstation]
    title:
      de: Rechteausweitung zu Administrator oder SYSTEM auf {element}
      en: Privilege escalation to administrator or SYSTEM on {element}
    scenario:
      de: >-
        Auf {element} arbeitet der Bediener mit einem eingeschränkten
        Windows-Konto. Ein Angreifer nutzt eine ungepatchte Schwachstelle, einen
        Dienst mit schwachen Dateirechten oder eine automatisch angemeldete
        Administrator-Sitzung, um SYSTEM-Rechte zu erlangen.
      en: >-
        On {element} the operator works with a restricted Windows account. An
        attacker exploits an unpatched vulnerability, a service with weak file
        permissions or an automatically logged-on administrator session to gain
        SYSTEM rights.
    consequence:
      de: >-
        Der Angreifer kann Schutzsoftware abschalten, Visualisierung und
        Steuerungssoftware verändern und sich im Netz weiter ausbreiten.
      en: >-
        The attacker can disable protective software, alter visualisation and
        control software and spread further in the network.
    environment: {interface: local, access: restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-k]
    attack_ics: [T0890]
    emb3d: [TID-219]
    iec62443: [FR2, FR3]
    measures: [least-privilege-services, os-hardening, patch-management-os, application-allowlisting]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20; MITRE EMB3D"]

  - id: unpatched-os-vulnerability
    rev: 1
    stride: [T, D, E]
    applies_to: [ipc-linux, ipc-windows, hmi, engineering-workstation, vision-system, historian]
    title:
      de: Ausnutzung bekannter Schwachstellen im ungepatchten Betriebssystem von {element}
      en: Exploitation of known vulnerabilities in the unpatched operating system of {element}
    scenario:
      de: >-
        Das Betriebssystem von {element} wird seit Auslieferung nicht
        aktualisiert, weil Updates die Freigabe der Maschine gefährden könnten.
        Ein Angreifer im Anlagennetz nutzt eine öffentlich bekannte
        Schwachstelle in einem Netzwerkdienst oder einer Bibliothek aus und
        führt eigenen Code aus.
      en: >-
        The operating system of {element} has not been updated since delivery
        because updates might jeopardise the machine's approval. An attacker in
        the plant network exploits a publicly known vulnerability in a network
        service or library and executes his own code.
    consequence:
      de: >-
        Übernahme oder Absturz des Systems, Ausfall der Produktion und
        Ausbreitung von Schadsoftware auf weitere Systeme.
      en: >-
        Takeover or crash of the system, loss of production and spread of
        malware to further systems.
    environment: {interface: known_network, access: restricted}
    impact: 4
    safety_related: false
    cra_refs: [AI-I-2-a, AI-I-2-c, AI-II-2]
    attack_ics: [T0866]
    emb3d: [TID-202]
    iec62443: [FR3, FR7]
    measures: [patch-management-os, security-update-process, network-segmentation, component-inventory-sbom]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20; MITRE EMB3D"]

  # --- operation: HMI, panels, vision --------------------------------------------------
  - id: hmi-kiosk-escape
    rev: 1
    stride: [E, T]
    applies_to: [hmi, ipc-windows, ipc-linux, mobile-panel]
    title:
      de: Ausbruch aus der Bedienoberfläche von {element} ins Betriebssystem
      en: Escape from the operator interface of {element} to the operating system
    scenario:
      de: >-
        Die Visualisierung auf {element} läuft ohne Kiosk-Modus. Über
        Tastenkombinationen, Datei-Dialoge, Hilfefenster, Druckdialoge oder
        eine Bildschirmtastatur gelangt ein Bediener oder Besucher auf den
        Desktop und startet beliebige Programme.
      en: >-
        The visualisation on {element} runs without kiosk mode. Through key
        combinations, file dialogs, help windows, print dialogs or an on-screen
        keyboard an operator or visitor reaches the desktop and starts arbitrary
        programs.
    consequence:
      de: >-
        Zugriff auf Betriebssystem, Projektdateien und Netzwerk. Steuerungswerte
        und Programme lassen sich am Rechteschema vorbei verändern, was
        Personen gefährden kann.
      en: >-
        Access to the operating system, project files and network. Control
        values and programs can be changed bypassing the permission scheme,
        which can endanger persons.
    environment: {interface: local, access: public_restricted, user: instructed}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-j]
    attack_ics: [T0823]
    iec62443: [FR2]
    measures: [kiosk-mode, os-hardening, application-allowlisting, usb-port-control]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: hmi-operator-impersonation
    rev: 1
    stride: [S]
    applies_to: [hmi, mobile-panel, ipc-windows]
    title:
      de: Bedienung unter fremder Benutzerkennung an {element}
      en: Operation under another user's identity on {element}
    scenario:
      de: >-
        An {element} bleibt eine Sitzung mit erhöhter Berechtigung, etwa
        Einrichter oder Instandhaltung, dauerhaft angemeldet, oder alle Bediener
        teilen sich eine PIN. Eine nicht berechtigte Person nutzt diese
        Sitzung, um Funktionen auszuführen, die ihr nicht zustehen.
      en: >-
        A session with elevated permission, such as setter or maintenance,
        remains logged in on {element}, or all operators share one PIN. An
        unauthorised person uses this session to execute functions he is not
        entitled to.
    consequence:
      de: >-
        Unzulässige Eingriffe wie geänderte Sollwerte oder Sonderbetriebsarten
        werden unter fremdem Namen ausgeführt und können Personen gefährden.
      en: >-
        Inadmissible interventions such as changed set points or special
        operating modes are performed under another name and can endanger
        persons.
    environment: {interface: local, access: public_restricted, user: instructed}
    impact: 3
    safety_related: true
    cra_refs: [AI-I-2-d]
    attack_ics: [T0859]
    iec62443: [FR1, FR2]
    measures: [session-timeout, role-based-access, strong-authentication]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: hmi-false-display
    rev: 1
    stride: [T]
    applies_to: [hmi, mobile-panel, ipc-windows, ipc-linux]
    title:
      de: Manipulierte Visualisierung auf {element} zeigt falschen Anlagenzustand
      en: Manipulated visualisation on {element} shows a false machine state
    scenario:
      de: >-
        Ein Angreifer verändert das Visualisierungsprojekt oder die
        Variablenzuordnung auf {element}, etwa über eine kompromittierte
        Engineering-Station oder einen Dateizugriff. Die Anzeige zeigt
        Normalzustand, während die Maschine tatsächlich gestört ist, oder
        Alarme werden unterdrückt.
      en: >-
        An attacker alters the visualisation project or the tag mapping on
        {element}, for example via a compromised engineering workstation or file
        access. The display shows normal state while the machine is actually
        faulty, or alarms are suppressed.
    consequence:
      de: >-
        Bediener treffen Entscheidungen auf Basis falscher Informationen und
        betreten zum Beispiel einen vermeintlich sicheren Bereich. Personen- und
        Sachschäden sind möglich.
      en: >-
        Operators decide based on false information and, for example, enter a
        supposedly safe area. Injuries and property damage are possible.
    environment: {interface: known_network, access: restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-f]
    attack_ics: [T0832, T0838]
    iec62443: [FR3]
    measures: [program-integrity-check, engineering-tool-integrity, role-based-access]
