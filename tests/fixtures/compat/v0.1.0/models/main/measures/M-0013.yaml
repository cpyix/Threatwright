title: No default passwords
description: The machine is shipped without known default passwords. Where components with a factory password are installed, these are changed during commissioning or the system enforces a change at first login. A checklist ensures that all components (controller, HMI, switch, router, drives) are covered.
library_ref: lib:ot/measure/no-default-passwords@1
kind: technical
evidence: Commissioning checklist with all components ticked, test report of a failed login with the factory password.
cra_refs: [AI-I-2-b, AI-I-2-d]
