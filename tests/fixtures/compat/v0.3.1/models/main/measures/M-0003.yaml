title: Unused ports and services disabled
description: Unneeded switch ports, network interfaces and network services (e.g. web server, FTP, Telnet, SNMP) are disabled on controller, HMI and switch. Unused physical sockets are additionally closed mechanically. The list of open ports is documented per device and reviewed on every change.
