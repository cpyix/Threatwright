[project]
name = "threatwright"
version = "0.0.1"
description = "Local-first threat modelling and risk analysis after BSI TR-03183-1 for the Cyber Resilience Act"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "ruamel.yaml>=0.18.6,<0.19",
    "typer>=0.12",
]

[project.scripts]
threatwright = "threatwright.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S314", "E501"]
"scripts/**" = ["S603", "S607", "S101"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
