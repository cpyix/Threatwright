  # --- logging --------------------------------------------------------------------
  - id: security-logging-missing
    rev: 1
    stride: [R]
    applies_to: [ipc-linux, ipc-windows, soft-plc, hmi, mobile-panel, vision-system, engineering-workstation, license-server, log-store, key-store, historian]
    title:
      de: Fehlende Sicherheitsprotokollierung lässt Angriffe auf {element} unentdeckt
      en: Missing security logging leaves attacks on {element} undetected
    scenario:
      de: >-
        {element} protokolliert Anmeldungen, fehlgeschlagene Zugriffe,
        Programm- und Parameteränderungen, Schlüsselverwendung sowie Updates
        nicht oder ohne verlässlichen Zeitstempel. Ein Angreifer verändert das
        System und kann später bestreiten, dass ein Eingriff stattgefunden hat.
      en: >-
        {element} does not record logins, failed access attempts, program and
        parameter changes, key usage and updates, or records them without a
        reliable time stamp. An attacker alters the system and can later deny
        that any intervention took place.
    consequence:
      de: >-
        Angriffe werden nicht oder zu spät erkannt, Vorfälle lassen sich weder
        aufklären noch fristgerecht melden.
      en: >-
        Attacks are detected late or not at all; incidents can neither be
        investigated nor reported in time.
    impact: 3
    safety_related: false
    cra_refs: [AI-I-2-l, Art14]
    iec62443: [FR6, FR2]
    measures: [security-logging, time-synchronization, log-protection]
    sources: ["generic OT threat knowledge"]

  - id: log-tampering
    rev: 1
    stride: [T, R]
    applies_to: [log-store, ipc-linux, ipc-windows, hmi]
    title:
      de: Angreifer löscht oder verfälscht Einträge in {element}
      en: Attacker deletes or falsifies entries in {element}
    scenario:
      de: >-
        Die Protokolle liegen lokal und sind mit denselben Rechten änderbar,
        mit denen der Angreifer bereits auf das System gelangt ist. Er löscht
        Einträge zu seinen Anmeldungen und Änderungen oder fügt falsche
        Einträge ein, um den Verdacht auf andere zu lenken.
      en: >-
        The logs are stored locally and can be modified with the same rights
        the attacker already obtained. He deletes entries about his logins and
        changes, or inserts false entries to divert suspicion to others.
    consequence:
      de: >-
        Spuren des Angriffs sind beseitigt, die forensische Analyse liefert
        falsche Ergebnisse und Verantwortliche lassen sich nicht ermitteln.
      en: >-
        Traces of the attack are removed; forensic analysis delivers wrong
        results and responsible persons cannot be identified.
    environment: {interface: local, access: restricted}
    impact: 3
    safety_related: false
    cra_refs: [AI-I-2-l, AI-I-2-f]
    attack_ics: [T0872]
    emb3d: [TID-225]
    iec62443: [FR6, FR3]
    measures: [log-protection, security-logging, role-based-access]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20; MITRE EMB3D"]

  - id: log-sensitive-data-leak
    rev: 1
    stride: [I]
    applies_to: [log-store, ipc-linux, ipc-windows, hmi]
    title:
      de: Protokolle in {element} enthalten Passwörter oder personenbezogene Daten
      en: Logs in {element} contain passwords or personal data
    scenario:
      de: >-
        Anwendungen schreiben Zugangsdaten, Sitzungsschlüssel, vollständige
        Anfragen oder Namen von Bedienern in die Protokolle. Protokolle werden
        für Supportfälle exportiert, per E-Mail versendet oder sind über eine
        Diagnoseseite lesbar, wodurch Unbefugte die Inhalte erhalten.
      en: >-
        Applications write credentials, session keys, full requests or operator
        names into the logs. Logs are exported for support cases, sent by
        e-mail or readable via a diagnostics page, so unauthorised persons
        obtain the contents.
    consequence:
      de: >-
        Erbeutete Zugangsdaten ermöglichen weitere Angriffe, personenbezogene
        Daten werden offengelegt.
      en: >-
        Captured credentials enable further attacks; personal data is
        disclosed.
    impact: 3
    safety_related: false
    cra_refs: [AI-I-2-e, AI-I-2-g]
    emb3d: [TID-226]
    iec62443: [FR4]
    measures: [data-minimisation, role-based-access, log-protection]
    sources: ["generic OT threat knowledge; MITRE EMB3D"]

  - id: log-flooding
    rev: 1
    stride: [D, R]
    applies_to: [log-store, historian, ipc-linux, ipc-windows]
    title:
      de: Gezielte Überflutung füllt {element} und verdrängt Einträge
      en: Deliberate flooding fills {element} and displaces entries
    scenario:
      de: >-
        Ein Angreifer erzeugt massenhaft Ereignisse, etwa fehlgeschlagene
        Anmeldungen oder fehlerhafte Anfragen. Der Speicher läuft voll, ältere
        Einträge werden überschrieben, oder das Dateisystem ist voll und
        Anwendungen auf dem Rechner versagen.
      en: >-
        An attacker generates masses of events, such as failed logins or
        malformed requests. The storage fills up, older entries are overwritten,
        or the file system becomes full and applications on the host fail.
    consequence:
      de: >-
        Beweise für den eigentlichen Angriff gehen verloren, im schlimmsten
        Fall fällt die Steuerungs- oder Bedienfunktion aus.
      en: >-
        Evidence of the actual attack is lost; in the worst case the control or
        operating function fails.
    environment: {interface: known_network, access: restricted}
    impact: 3
    safety_related: false
    cra_refs: [AI-I-2-h, AI-I-2-l]
    attack_ics: [T0872]
    iec62443: [FR6, FR7]
    measures: [dos-rate-limiting, log-protection, security-logging]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  # --- data stores ----------------------------------------------------------------
  - id: recipe-manipulation
    rev: 1
    stride: [T]
    applies_to: [recipe-store, hmi, ipc-windows, ipc-linux]
    title:
      de: Manipulation von Rezepten und Parametern in {element}
      en: Manipulation of recipes and parameters in {element}
    scenario:
      de: >-
        Rezepte und Prozessparameter sind ohne Zugriffsschutz und
        Integritätsprüfung gespeichert. Ein Angreifer oder unberechtigter
        Mitarbeiter ändert Temperaturen, Drücke, Geschwindigkeiten oder
        Dosiermengen. Die Maschine übernimmt die Werte ohne Plausibilitätsprüfung.
      en: >-
        Recipes and process parameters are stored without access protection and
        integrity check. An attacker or unauthorised employee changes
        temperatures, pressures, speeds or dosing quantities. The machine
        applies the values without plausibility check.
    consequence:
      de: >-
        Ausschuss, Qualitätsmängel beim Kunden und Schäden an Werkzeug oder
        Maschine. Extreme Werte können Personen gefährden.
      en: >-
        Scrap, quality defects at the customer and damage to tooling or machine.
        Extreme values can endanger persons.
    environment: {interface: known_network, access: restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-f, AI-I-2-d]
    attack_ics: [T0836, T0879]
    iec62443: [FR3, FR2]
    measures: [recipe-change-approval, parameter-plausibility, config-integrity-check, role-based-access]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: recipe-changes-untraceable
    rev: 1
    stride: [R]
    applies_to: [recipe-store, hmi]
    title:
      de: Änderungen an Rezepten in {element} sind nicht nachvollziehbar
      en: Changes to recipes in {element} are not traceable
    scenario:
      de: >-
        Es gibt keinen Änderungsverlauf für Rezepte und Parameter. Eine Person
        ändert einen Wert, der später zu Ausschuss oder einem Schaden führt,
        und kann bestreiten, die Änderung vorgenommen zu haben.
      en: >-
        There is no change history for recipes and parameters. A person
        changes a value that later leads to scrap or damage and can deny having
        made the change.
    consequence:
      de: >-
        Qualitäts- und Haftungsfragen bleiben ungeklärt, ein Angriff wird nicht
        als solcher erkannt.
      en: >-
        Quality and liability questions remain unresolved; an attack is not
        recognised as such.
    impact: 3
    safety_related: false
    cra_refs: [AI-I-2-l]
    iec62443: [FR6, FR2]
    measures: [security-logging, role-based-access, recipe-change-approval]
    sources: ["generic OT threat knowledge"]

  - id: recipe-know-how-exfiltration
    rev: 1
    stride: [I]
    applies_to: [recipe-store, historian]
    title:
      de: Rezepte und Prozess-Know-how aus {element} werden ausgeleitet
      en: Recipes and process know-how are exfiltrated from {element}
    scenario:
      de: >-
        {element} ist über Netzfreigaben, Datenbankzugänge oder Exportfunktionen
        ohne Berechtigungsprüfung lesbar. Ein Angreifer oder Innentäter kopiert
        Rezepturen und Prozessparameter, die das Ergebnis jahrelanger
        Optimierung sind.
      en: >-
        {element} is readable via network shares, database access or export
        functions without permission checks. An attacker or insider copies
        formulations and process parameters that are the result of years of
        optimisation.
    consequence:
      de: >-
        Verlust von Betriebsgeheimnissen und Wettbewerbsvorteil des Betreibers.
      en: >-
        Loss of trade secrets and of the operator's competitive advantage.
    environment: {interface: known_network, access: restricted}
    impact: 4
    safety_related: false
    cra_refs: [AI-I-2-e, AI-I-2-d]
    attack_ics: [T0882, T0811]
    iec62443: [FR4, FR2]
    measures: [role-based-access, data-encryption-rest, data-minimisation]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: data-store-destruction
    rev: 1
    stride: [D]
    applies_to: [recipe-store, historian, key-store]
    title:
      de: Angreifer löscht oder verschlüsselt den Datenbestand in {element}
      en: Attacker deletes or encrypts the data in {element}
    scenario:
      de: >-
        Ein Angreifer mit Schreibzugriff löscht, überschreibt oder verschlüsselt
        den Inhalt von {element}, etwa Rezepte, Prozesshistorie oder
        Zertifikate. Eine getrennt aufbewahrte, getestete Sicherung existiert
        nicht.
      en: >-
        An attacker with write access deletes, overwrites or encrypts the
        content of {element}, such as recipes, process history or certificates.
        No separately stored, tested backup exists.
    consequence:
      de: >-
        Die Produktion kann nicht fortgesetzt werden, Nachweise gehen verloren
        und die Wiederherstellung dauert lange.
      en: >-
        Production cannot continue, records are lost and recovery takes a long
        time.
    environment: {interface: known_network, access: restricted}
    impact: 4
    safety_related: false
    cra_refs: [AI-I-2-h]
    attack_ics: [T0809]
    iec62443: [FR7, FR2]
    measures: [backup-restore, role-based-access]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: historian-data-falsification
    rev: 1
    stride: [T]
    applies_to: [historian]
    title:
      de: Verfälschung der Prozessdatenhistorie in {element}
      en: Falsification of process data history in {element}
    scenario:
      de: >-
        Ein Angreifer oder Innentäter ändert nachträglich Messwerte,
        Chargendaten oder Alarmverläufe im Archiv, etwa um eine Störung zu
        verschleiern oder Qualitätsnachweise zu fälschen. Das Archiv erkennt
        Änderungen an bereits gespeicherten Daten nicht.
      en: >-
        An attacker or insider subsequently alters measured values, batch data
        or alarm histories in the archive, for example to conceal a fault or to
        forge quality records. The archive does not detect changes to data
        already stored.
    consequence:
      de: >-
        Qualitäts- und Rückverfolgbarkeitsnachweise sind wertlos, Analysen und
        Optimierungen beruhen auf falschen Daten.
      en: >-
        Quality and traceability records become worthless; analyses and
        optimisations rely on false data.
    environment: {interface: known_network, access: restricted}
    impact: 3
    safety_related: false
    cra_refs: [AI-I-2-f]
    attack_ics: [T0836]
    iec62443: [FR3]
    measures: [role-based-access, config-integrity-check, security-logging, backup-restore]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: historian-data-theft
    rev: 1
    stride: [I]
    applies_to: [historian]
    title:
      de: Unbefugter Abruf von Produktionsdaten aus {element}
      en: Unauthorised retrieval of production data from {element}
    scenario:
      de: >-
        Der Historian ist für Auswertungen aus dem Büronetz erreichbar und
        verwendet ein gemeinsames Lesekonto oder unverschlüsselte
        Verbindungen. Ein Angreifer liest Auslastung, Stückzahlen und
        Prozessverläufe aus und erhält damit Einblick in die Produktion.
      en: >-
        The historian is reachable from the office network for analyses and
        uses a shared read account or unencrypted connections. An attacker reads
        utilisation, quantities and process histories and thereby gains insight
        into production.
    consequence:
      de: >-
        Abfluss vertraulicher Betriebsdaten und Vorbereitung gezielter Angriffe
        auf die Anlage.
      en: >-
        Leakage of confidential operating data and preparation of targeted
        attacks on the plant.
    environment: {interface: known_network, access: restricted}
    impact: 3
    safety_related: false
    cra_refs: [AI-I-2-e]
    attack_ics: [T0811, T0882]
    iec62443: [FR4]
    measures: [role-based-access, data-encryption-transit, network-segmentation]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: trust-store-manipulation
    rev: 1
    stride: [T, S]
    applies_to: [key-store, ipc-linux, ipc-windows]
    title:
      de: Fremde Zertifikate werden in {element} als vertrauenswürdig eingetragen
      en: Foreign certificates are added to {element} as trusted
    scenario:
      de: >-
        Der Speicher für vertrauenswürdige Zertifikate ist für Anwendungen oder
        Bediener ohne besondere Berechtigung beschreibbar. Ein Angreifer trägt
        ein eigenes Zertifikat ein oder ersetzt einen Schlüssel. Danach
        akzeptiert das Gerät seine Server, Clients oder signierten Pakete als
        echt.
      en: >-
        The store of trusted certificates is writable by applications or
        operators without special permission. An attacker adds his own
        certificate or replaces a key. Afterwards the device accepts his
        servers, clients or signed packages as genuine.
    consequence:
      de: >-
        Verschlüsselung und Authentisierung werden unbemerkt ausgehebelt, der
        Angreifer kann Verbindungen mitlesen und Daten einschleusen.
      en: >-
        Encryption and authentication are silently undermined; the attacker can
        read connections and inject data.
    environment: {interface: local, access: restricted}
    impact: 4
    safety_related: false
    cra_refs: [AI-I-2-f, AI-I-2-d]
    iec62443: [FR3, FR1]
    measures: [certificate-management, secrets-protected-storage, config-integrity-check]
    sources: ["generic OT threat knowledge"]

  # --- license ------------------------------------------------------------------
  - id: license-failure-production-stop
    rev: 1
    stride: [D, T]
    applies_to: [license-server, ipc-windows, soft-plc, hmi, engineering-workstation]
    title:
      de: Ausfall oder Manipulation von {element} stoppt die Produktion
      en: Failure or manipulation of {element} stops production
    scenario:
      de: >-
        Steuerungs- oder Visualisierungssoftware prüft ihre Lizenz laufend bei
        einem Lizenzserver oder Dongle. Ein Angreifer blockiert die
        Netzverbindung zum Lizenzserver, verändert die Lizenzdatei, entfernt
        den Dongle oder setzt die Systemzeit vor, sodass Lizenzen als
        abgelaufen gelten.
      en: >-
        Control or visualisation software continuously checks its licence with
        a license server or dongle. An attacker blocks the network connection
        to the license server, alters the licence file, removes the dongle or
        sets the system time forward so that licences appear expired.
    consequence:
      de: >-
        Software startet nicht mehr oder schaltet in einen Demo-Modus, die
        Maschine steht still und es entstehen Produktionsausfälle.
      en: >-
        Software no longer starts or switches to a demo mode; the machine stops
        and production is lost.
    environment: {interface: known_network, access: restricted}
    impact: 3
    safety_related: false
    cra_refs: [AI-I-2-h]
    attack_ics: [T0828, T0826]
    iec62443: [FR7]
    measures: [license-grace-operation, time-synchronization, network-segmentation, physical-access-control]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: license-server-spoofing
    rev: 1
    stride: [S]
    applies_to: [license-server]
    title:
      de: Gefälschter Lizenzserver oder Dongle-Emulator ersetzt {element}
      en: Fake license server or dongle emulator replaces {element}
    scenario:
      de: >-
        Die Software prüft nicht, ob sie mit dem echten Lizenzserver oder Dongle
        kommuniziert. Ein Angreifer stellt einen eigenen Lizenzdienst oder einen
        Dongle-Emulator bereit, häufig in Form eines aus dem Internet geladenen
        Hilfsprogramms, das zusätzlich Schadcode enthält, und gibt Lizenzen
        frei oder entzieht sie gezielt.
      en: >-
        The software does not verify that it communicates with the genuine
        license server or dongle. An attacker provides his own licence service
        or a dongle emulator, often as a tool downloaded from the internet that
        also contains malicious code, and grants or selectively revokes
        licences.
    consequence:
      de: >-
        Schadcode gelangt mit hohen Rechten auf den Rechner, und der Angreifer
        kann die Produktion durch Entzug der Lizenzen jederzeit stoppen.
      en: >-
        Malicious code reaches the host with high privileges, and the attacker
        can stop production at any time by revoking licences.
    environment: {interface: known_network, access: restricted}
    impact: 3
    safety_related: false
    cra_refs: [AI-I-2-d, AI-I-2-f]
    attack_ics: [T0849]
    iec62443: [FR1]
    measures: [mutual-tls, certificate-management, application-allowlisting]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: license-service-exploit
    rev: 1
    stride: [I, E]
    applies_to: [license-server]
    title:
      de: Netzwerkdienst des {element} als Einfallstor mit hohen Rechten
      en: Network service of {element} as an entry point with high privileges
    scenario:
      de: >-
        Der Lizenzdienst lauscht im Netz, läuft mit Administrator- oder
        SYSTEM-Rechten und wird selten aktualisiert. Ein Angreifer nutzt eine
        Schwachstelle im Dienst, um Code auszuführen oder Informationen über
        installierte Software, Rechner und Lizenzen abzufragen.
      en: >-
        The licence service listens on the network, runs with administrator or
        SYSTEM rights and is rarely updated. An attacker exploits a
        vulnerability in the service to execute code or to query information
        about installed software, hosts and licences.
    consequence:
      de: >-
        Übernahme des Rechners mit höchsten Rechten und Ausgangspunkt für
        weitere Angriffe auf die Anlage.
      en: >-
        Takeover of the host with highest privileges and a starting point for
        further attacks on the plant.
    environment: {interface: known_network, access: restricted}
    impact: 4
    safety_related: false
    cra_refs: [AI-I-2-a, AI-I-2-j]
    attack_ics: [T0866, T0890]
    iec62443: [FR3, FR5]
    measures: [patch-management-os, least-privilege-services, firewall-allowlist, supplier-vulnerability-monitoring]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  # --- lifecycle ------------------------------------------------------------------
  - id: decommissioning-data-remains
    rev: 1
    stride: [I]
    applies_to: [ipc-linux, ipc-windows, hmi, mobile-panel, vision-system, engineering-workstation, plc, key-store, recipe-store, historian]
    title:
      de: Daten und Zugangsdaten bleiben bei Außerbetriebnahme oder Weiterverkauf auf {element}
      en: Data and credentials remain on {element} after decommissioning or resale
    scenario:
      de: >-
        {element} wird ausgetauscht, verschrottet, zur Reparatur eingeschickt
        oder mit der Maschine weiterverkauft, ohne dass Programme, Rezepte,
        Protokolle, Zertifikate und Passwörter sicher gelöscht werden. Der neue
        Besitzer oder ein Dritter liest den Speicher aus.
      en: >-
        {element} is replaced, scrapped, sent in for repair or resold with the
        machine without programs, recipes, logs, certificates and passwords
        being securely erased. The new owner or a third party reads the
        memory.
    consequence:
      de: >-
        Abfluss von Know-how und Zugangsdaten, mit denen sich noch laufende
        Anlagen oder Fernwartungszugänge angreifen lassen.
      en: >-
        Leakage of know-how and credentials that can be used to attack plants
        still in operation or remote maintenance accesses.
    environment: {interface: physical, access: movable}
    impact: 4
    safety_related: false
    cra_refs: [AI-I-2-m, AI-I-2-e]
    iec62443: [FR4]
    measures: [secure-decommissioning, factory-reset, data-encryption-rest, user-security-documentation]
    sources: ["generic OT threat knowledge"]
