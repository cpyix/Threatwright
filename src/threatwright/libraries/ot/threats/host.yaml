    applies_to: [service-laptop, engineering-workstation]
    title:
      de: Verlust oder Diebstahl von {element} mit Kundendaten
      en: Loss or theft of {element} with customer data
    scenario:
      de: >-
        Auf {element} liegen Projektstände, Zugangsdaten und Netzpläne vieler
        Kunden unverschlüsselt. Das Gerät wird im Fahrzeug, am Flughafen oder
        beim Kunden gestohlen oder geht verloren.
      en: >-
        Project versions, credentials and network plans of many customers are
        stored unencrypted on {element}. The device is stolen or lost in a
        vehicle, at an airport or at a customer site.
    consequence:
      de: >-
        Der Finder erhält Know-how und Zugänge zu zahlreichen Maschinen und kann
        diese gezielt angreifen.
      en: >-
        The finder obtains know-how and access to numerous machines and can
        attack them in a targeted way.
    environment: {interface: physical, access: movable}
