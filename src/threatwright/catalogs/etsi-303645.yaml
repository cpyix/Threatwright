id: etsi-303645
title: ETSI EN 303 645 consumer IoT baseline requirements
version: V3.1.3
retrieved: '2026-10-20'
source: https://www.etsi.org/deliver/etsi_en/303600_303699/303645/03.01.03_60/en_303645v030103p.pdf
entries:
  '5.0-1': Justification recorded for each non-applied recommendation
  '5.1-1': Passwords unique per device or user-defined
  '5.1-2': Pre-installed passwords unique and not guessable
  '5.1-2A': No passwords for machine-to-machine authentication
  '5.1-3': Best-practice authentication mechanisms
  '5.1-4': Users can be told how to change authentication values
  '5.1-5': Brute-force protection on authentication
  '5.2-1': Public vulnerability disclosure policy
  '5.2-2': Timely action on disclosed vulnerabilities
  '5.2-3': Continuous vulnerability monitoring and fixing
  '5.3-1': Updatable software components
  '5.3-2': Secure update mechanism
  '5.3-3': Updates simple for the user to apply
  '5.3-4A': Update mechanism configurable to run automatically
  '5.3-4B': Automatic updates activated at initialization
  '5.3-5': Check for security updates after initialization
  '5.3-6A': User can enable or disable automatic updates
  '5.3-6B': User can enable or disable update notifications
  '5.3-7': Best-practice cryptography in updates
  '5.3-8': Timely security updates
  '5.3-9': Authenticity and integrity of updates verified
  '5.3-10': Updates verified before install when delivered over a network
  '5.3-11': User informed that a security update is required
  '5.3-12': User notified when an update disrupts basic functionality
  '5.3-13': Published defined support period
  '5.3-14': Rationale given for devices that cannot be updated
  '5.3-15A': Non-updatable devices can be isolated
  '5.3-15B': Non-updatable device hardware replaceable
  '5.3-16': Model designation clearly recognizable
  '5.4-1': Sensitive security parameters stored securely
  '5.4-2': Unique per-device identity protected from modification
  '5.4-3': No hard-coded critical security parameters in source
  '5.4-4': Update and communication trust anchors protected
  '5.5-1': Best-practice cryptography for secure communication
  '5.5-2': Reviewed or evaluated cryptographic implementations
  '5.5-3': Cryptographic algorithms replaceable
  '5.5-4': Network functionality only after authentication in initialized state
  '5.5-5': Security-relevant configuration changes require authentication
  '5.5-6': Critical security parameters encrypted in transit
  '5.5-7': Confidentiality of critical security parameters in transit
  '5.5-8': Secure management of critical security parameters
  '5.6-1': Unused network and logical interfaces disabled
  '5.6-2': Minimized unauthenticated network exposure
  '5.6-3': Physical interfaces not needlessly exposed
  '5.6-4A': Debug interfaces disabled or protected
  '5.6-4B': Physical debug ports physically protected
  '5.6-5': Only required software services enabled
  '5.6-6': Code minimized to necessary functionality
  '5.6-7': Software runs with least privilege
  '5.6-8': Hardware-level memory access control
  '5.6-9': Secure development processes
  '5.7-1': Software verified by secure boot
  '5.7-2': User or administrator alerted on unauthorized software change
  '5.8-1': Confidentiality of personal data in transit
  '5.8-2': Confidentiality of sensitive personal data in transit
  '5.8-3': External sensing capabilities documented
  '5.9-1': Resilience to outages of data networks and power
  '5.9-2': Local operation during network loss
  '5.9-3': Stable network reconnection after outage
  '5.10-1': Telemetry examined for security anomalies
  '5.11-1': User data erasable from the device
  '5.11-2': Personal data erasable on the device
  '5.11-3': Clear instructions for deleting personal data
  '5.11-4': Confirmation that personal data was deleted
  '5.12-1': Minimal user decisions during setup and maintenance
  '5.12-2': Secure set-up guidance for users
  '5.12-3': Guidance for checking set-up security
  '5.13-1A': Validation of input via user interfaces
  '5.13-1B': Validation of input via network interfaces
  '6-1': Transparent information on personal data processing
  '6-2': Consent obtained before processing on consent basis
  '6-3A': Consent can be withdrawn
  '6-3B': Consent withdrawal information available
  '6-4': Telemetry processing limited and opt-out possible
  '6-5': Information on telemetry collected
  '6-6': Personal data protection when processing
  '6-7': Users informed about purpose of data collection
  '6-8': Data anonymization where appropriate
