    title:
      de: Kompromittierte Engineering-Station lädt manipuliertes Programm auf {element}
      en: Compromised engineering workstation downloads a manipulated program to {element}
    scenario:
      de: >-
        Schadsoftware auf der Engineering-Station verändert Projektdateien oder
        hängt sich in das Engineering-Tool ein. Beim nächsten regulären
        Programmdownload wird zusätzlicher oder geänderter Code in die
        Steuerung übertragen, während das Tool dem Anwender den unveränderten
        Stand anzeigt.
      en: >-
        Malware on the engineering workstation alters project files or hooks
        into the engineering tool. With the next regular program download,
        additional or altered code is transferred to the controller while the
        tool shows the user the unchanged version.
    consequence:
      de: >-
        Die Steuerung arbeitet mit verdeckt manipulierter Logik. Maschinenschäden
        und Gefährdung von Personen sind möglich, die Ursache bleibt lange
        unentdeckt.
      en: >-
        The controller runs covertly manipulated logic. Machine damage and
        danger to persons are possible; the cause stays undetected for a long
        time.
    environment: {interface: known_network, access: restricted, user: skilled}
    impact: 5
    safety_related: true
