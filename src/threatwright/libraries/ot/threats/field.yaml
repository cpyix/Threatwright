    sources: ["generic OT threat knowledge"]

  - id: io-link-forged-sensor
    rev: 1
    stride: [S, T]
    applies_to: [io-link, smart-field-device]
    title:
      de: Untergeschobenes Gerät gibt sich als Sensor an {element} aus
      en: Substituted device impersonates the sensor on {element}
    scenario:
      de: >-
        Ein Angreifer ersetzt einen IO-Link-Sensor durch ein eigenes Gerät, das
        dieselbe Hersteller- und Gerätekennung meldet. Die Identitätsprüfung des
        Masters beruht nur auf diesen frei setzbaren Kennungen und erkennt den
        Tausch nicht. Das Gerät liefert beliebige Messwerte.
      en: >-
        An attacker replaces an IO-Link sensor with their own device reporting the
        same vendor and device identifiers. The master's identity check relies only
        on these freely settable identifiers and does not detect the swap. The
        device delivers arbitrary measured values.
    consequence:
      de: >-
        Die Steuerung arbeitet mit vorgetäuschten Messwerten; Fehlproduktion und
        gefährliche Zustände sind möglich.
      en: >-
        The controller works with spoofed measured values; faulty production and
        hazardous states are possible.
    environment: {interface: local, access: public_restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-f]
    attack_ics: [T0849]
    iec62443: [FR1, FR3]
    measures: [physical-access-control, tamper-evident-seals, parameter-plausibility, genuine-spare-parts]
    sources: ["generic OT threat knowledge"]

  # --- denial of service --------------------------------------------------------
  - id: fieldbus-dos
    rev: 1
    stride: [D]
    applies_to: [fieldbus-ethercat, fieldbus-profinet, fieldbus-modbus-tcp, fieldbus-modbus-rtu, fieldbus-canopen, io-link]
    title:
      de: Störung von {element} führt zum Stillstand
      en: Disruption of {element} leads to standstill
    scenario:
      de: >-
        Ein Angreifer überflutet den Bus oder das Netz mit Telegrammen, sendet
        hochpriore Störtelegramme (z. B. dominante CAN-Identifier) oder unterbricht
        bzw. stört die Leitung physisch. Die zyklische Kommunikation verpasst ihre
        Zeitfenster und die Watchdogs der Teilnehmer lösen aus.
      en: >-
        An attacker floods the bus or network with telegrams, sends high-priority
        jamming telegrams (e.g. dominant CAN identifiers) or physically interrupts
        or disturbs the line. Cyclic communication misses its time slots and the
        watchdogs of the nodes trip.
    consequence:
      de: >-
        Die Maschine stoppt, Produktion fällt aus; wiederholte Störungen können
        Bediener dazu verleiten, Schutzfunktionen zu umgehen.
      en: >-
        The machine stops and production is lost; repeated disruptions may tempt
        operators to bypass protective functions.
    environment: {interface: local, access: restricted}
    impact: 3
    cra_refs: [AI-I-2-h, AI-I-2-i]
    attack_ics: [T0814, T0813, T1695]
    emb3d: [TID-405]
    iec62443: [FR7]
    measures: [fieldbus-physical-protection, dos-rate-limiting, watchdog-safe-state, network-monitoring-ids]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: field-device-malformed-telegram-crash
    rev: 1
    stride: [D]
    applies_to: [remote-io, drive, smart-field-device, process-device, plc]
    title:
      de: Fehlerhafte Telegramme bringen {element} zum Absturz
      en: Malformed telegrams crash {element}
    scenario:
      de: >-
        Der Protokollstapel des Geräts prüft Länge und Inhalt eingehender
        Telegramme unzureichend. Ein Angreifer mit Bus- oder Netzzugang sendet
        gezielt fehlerhafte Telegramme, woraufhin das Gerät hängen bleibt oder neu
        startet.
      en: >-
        The device's protocol stack insufficiently checks length and content of
        incoming telegrams. An attacker with bus or network access sends crafted
        malformed telegrams, causing the device to hang or restart.
    consequence:
      de: >-
        Das Gerät fällt aus und muss ggf. vor Ort neu gestartet werden; die
        Maschine steht still.
      en: >-
        The device fails and may need to be restarted on site; the machine stops.
    environment: {interface: local, access: restricted}
    impact: 3
    cra_refs: [AI-I-2-h, AI-I-2-a]
    attack_ics: [T0814]
    emb3d: [TID-404, TID-202]
    iec62443: [FR7, FR3]
    measures: [input-validation, security-testing, watchdog-safe-state, security-update-process]
    sources: ["generic OT threat knowledge; MITRE EMB3D"]

  # --- field devices ------------------------------------------------------------
  - id: field-device-impersonation
    rev: 1
    stride: [S]
    applies_to: [remote-io, drive, smart-field-device, process-device]
    title:
      de: Fremdes Gerät gibt sich als {element} aus
      en: Foreign device impersonates {element}
    scenario:
      de: >-
        Die Steuerung erkennt Feldgeräte nur an Adresse, Gerätename oder
        Identitätsobjekt, die sich frei einstellen lassen. Ein Angreifer ersetzt
        das Gerät oder emuliert es mit eigener Hardware und meldet sich mit
        denselben Kennungen am Bus an.
      en: >-
        The controller identifies field devices only by address, device name or
        identity object, all of which can be set freely. An attacker replaces the
        device or emulates it with their own hardware and joins the bus with the
        same identifiers.
    consequence:
      de: >-
        Die Steuerung tauscht Daten mit einem Gerät unter fremder Kontrolle aus;
        Eingänge werden vorgetäuscht und Ausgänge nicht wie befohlen ausgeführt.
      en: >-
        The controller exchanges data with a device under foreign control; inputs
        are spoofed and outputs are not executed as commanded.
    environment: {interface: local, access: restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-d]
    attack_ics: [T0849]
    emb3d: [TID-406]
    iec62443: [FR1]
    measures: [fieldbus-topology-monitoring, tamper-evident-seals, physical-access-control, genuine-spare-parts]
    sources: ["generic OT threat knowledge"]

  - id: field-device-unlogged-change
    rev: 1
    stride: [R]
    applies_to: [remote-io, drive, smart-field-device, process-device]
    title:
      de: Nicht nachvollziehbare Parameter- oder Firmwareänderung an {element}
      en: Untraceable parameter or firmware change on {element}
    scenario:
      de: >-
        Das Gerät protokolliert Änderungen an Parametern oder Firmware nicht oder
        ohne Angabe von Zeitpunkt, Zugangsweg und Urheber. Ein Angreifer oder
        unbefugter Dienstleister ändert das Gerät über Bus oder Service-Schnittstelle,
        und die Änderung lässt sich später niemandem zuordnen.
      en: >-
        The device does not log changes to parameters or firmware, or logs them
        without time, access path and originator. An attacker or unauthorised
        service provider changes the device via bus or service interface, and the
        change cannot later be attributed to anyone.
    consequence:
      de: >-
        Manipulationen werden spät oder gar nicht erkannt, die Ursachenanalyse nach
        einem Vorfall ist erschwert und Verantwortlichkeiten bleiben unklar.
      en: >-
        Manipulation is detected late or not at all, root cause analysis after an
        incident is hampered and responsibilities remain unclear.
    environment: {interface: local, access: restricted}
    impact: 2
    cra_refs: [AI-I-2-l]
    attack_ics: [T0872]
    iec62443: [FR6, FR2]
    measures: [security-logging, config-integrity-check, time-synchronization, change-management]
    sources: ["generic OT threat knowledge"]

  - id: field-device-configuration-readout
    rev: 1
    stride: [I]
    applies_to: [remote-io, drive, smart-field-device, process-device]
    title:
      de: Auslesen von Konfiguration und Prozess-Know-how aus {element}
      en: Readout of configuration and process know-how from {element}
    scenario:
      de: >-
        Über azyklische Feldbusdienste, die Service-Schnittstelle oder ein
        Inbetriebnahme-Tool lassen sich sämtliche Geräteparameter ohne
        Authentisierung auslesen, z. B. Reglereinstellungen, Prozessparameter oder
        hinterlegte Kennlinien.
      en: >-
        Via acyclic fieldbus services, the service interface or a commissioning
        tool, all device parameters can be read without authentication, e.g.
        controller tuning, process parameters or stored characteristic curves.
    consequence:
      de: >-
        Verfahrens-Know-how geht an Wettbewerber oder Angreifer verloren und
        erleichtert gezielte Manipulationen.
      en: >-
        Process know-how is lost to competitors or attackers and facilitates
        targeted manipulation.
    environment: {interface: local, access: restricted}
    impact: 2
    cra_refs: [AI-I-2-e, AI-I-2-d]
    attack_ics: [T0882, T0888]
    emb3d: [TID-310]
    iec62443: [FR4, FR2]
    measures: [fieldbus-mailbox-restriction, role-based-access, debug-interfaces-disabled]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: field-device-service-port-access
    rev: 1
    stride: [E, T]
    applies_to: [drive, smart-field-device, process-device, remote-io]
    title:
      de: Vollzugriff über die Service-Schnittstelle von {element}
      en: Full access via the service interface of {element}
    scenario:
      de: >-
        Das Gerät besitzt eine lokale Service-Schnittstelle (z. B. USB, serieller
        Port, Bluetooth-Dongle), über die ohne Anmeldung alle Parameter, Firmware
        und Diagnosefunktionen erreichbar sind. Wer Zugang zum Schaltschrank hat,
        erhält damit mehr Rechte, als ihm der Betrieb über die Steuerung erlaubt.
      en: >-
        The device has a local service interface (e.g. USB, serial port,
        Bluetooth dongle) that grants access to all parameters, firmware and
        diagnostic functions without login. Anyone with access to the control
        cabinet thus obtains more rights than operation via the controller permits.
    consequence:
      de: >-
        Grenzwerte, Betriebsarten oder Firmware werden verändert, ohne dass die
        Steuerung dies bemerkt; gefährliche Zustände sind möglich.
      en: >-
        Limits, operating modes or firmware are changed without the controller
        noticing; hazardous states are possible.
    environment: {interface: physical, access: restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-d, AI-I-2-j]
    attack_ics: [T0836]
    emb3d: [TID-224, TID-116]
    iec62443: [FR1, FR2]
    measures: [debug-interfaces-disabled, strong-authentication, physical-access-control, tamper-evident-seals]
    sources: ["generic OT threat knowledge; MITRE EMB3D"]

  - id: supplier-field-device-unvetted-firmware
    rev: 1
    stride: [T, E]
    applies_to: [smart-field-device, drive, remote-io, process-device]
    title:
      de: Zugekauftes Feldgerät {element} mit ungeprüfter Firmware
      en: Purchased field device {element} with unvetted firmware
    scenario:
      de: >-
        Zugelieferte Feldgeräte bringen eigene Firmware mit, deren Inhalt,
        Komponenten und Schwachstellen dem Maschinenhersteller unbekannt sind. Die
        Firmware kann verwundbare Bibliotheken, undokumentierte Dienste, feste
        Zugangsdaten oder in der Lieferkette eingeschleusten Code enthalten.
      en: >-
        Supplied field devices come with their own firmware whose content,
        components and vulnerabilities are unknown to the machine manufacturer. The
        firmware may contain vulnerable libraries, undocumented services, hard-coded
        credentials or code injected in the supply chain.
    consequence:
      de: >-
        Angreifer nutzen die Schwachstellen des Geräts als Einstieg in die Maschine;
        der Hersteller kann Schwachstellen weder erkennen noch zeitnah beheben.
      en: >-
        Attackers use the device's vulnerabilities as entry into the machine; the
        manufacturer can neither detect vulnerabilities nor fix them in time.
    impact: 4
    cra_refs: [AI-II-1, AI-I-2-a, AI-I-2-c]
    attack_ics: [T0862]
    emb3d: [TID-401, TID-328]
    iec62443: [FR3]
    measures: [supplier-security-requirements, third-party-firmware-review, component-inventory-sbom, supplier-vulnerability-monitoring]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  # --- drives -------------------------------------------------------------------
  - id: drive-parameter-manipulation
    rev: 1
    stride: [T]
    applies_to: [drive]
    title:
      de: Manipulation von Drehzahl- und Drehmomentgrenzen in {element}
      en: Manipulation of speed and torque limits in {element}
    scenario:
      de: >-
        Ein Angreifer ändert über Feldbus, Service-Schnittstelle oder
        Inbetriebnahme-Software die Parameter des Antriebsreglers, z. B.
        Maximaldrehzahl, Drehmoment- und Stromgrenzen, Rampen, Software-Endlagen
        oder die Reaktion auf Kommunikationsausfall. Ohne Prüfung der Parameter
        durch die Steuerung bleibt die Änderung unbemerkt.
      en: >-
        An attacker changes the parameters of the drive controller via fieldbus,
        service interface or commissioning software, e.g. maximum speed, torque and
        current limits, ramps, software limit switches or the reaction to
        communication loss. Without the controller checking the parameters the
        change goes unnoticed.
    consequence:
      de: >-
        Achsen fahren schneller oder mit mehr Kraft als vorgesehen, überfahren
        Endlagen oder bleiben bei Störung nicht stehen; Personen und Maschine können
        geschädigt werden, sofern keine sichere Überwachung greift.
      en: >-
        Axes move faster or with more force than intended, overrun end positions
        or do not stop on faults; persons and machine can be harmed unless a safe
        monitoring function intervenes.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-f, AI-I-2-d]
    attack_ics: [T0836, T0831]
    iec62443: [FR3, FR2]
    measures: [safety-speed-monitoring, parameter-plausibility, config-integrity-check, fieldbus-mailbox-restriction]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: drive-brake-control-manipulation
    rev: 1
    stride: [T]
    applies_to: [drive, safety-relevant-outputs]
    title:
      de: Haltebremse wird über Standardsoftware von {element} geöffnet
      en: Holding brake is released via standard software of {element}
    scenario:
      de: >-
        Die Haltebremse einer vertikalen oder schwerkraftbelasteten Achse wird über
        einen Prozessdatenbefehl oder Parameter des Antriebs angesteuert, ohne
        sichere Bremsenansteuerung. Ein Angreifer mit Buszugang oder Zugriff auf
        die Steuerungslogik öffnet die Bremse bei abgeschaltetem Antrieb.
      en: >-
        The holding brake of a vertical or gravity-loaded axis is controlled via a
        process data command or drive parameter without safe brake control. An
        attacker with bus access or access to the control logic releases the brake
        while the drive is disabled.
    consequence:
      de: >-
        Die Last sackt ab oder fällt herunter; Personen im Gefahrenbereich können
        schwer verletzt werden.
      en: >-
        The load sags or falls; persons in the danger zone can be seriously injured.
    environment: {interface: local, access: restricted}
    impact: 5
    safety_related: true
    cra_refs: [AI-I-2-f, AI-I-2-d]
    attack_ics: [T0831, T0880]
    iec62443: [FR3]
    measures: [safety-separation, safe-communication-profile, fieldbus-physical-protection]
    sources: ["generic OT threat knowledge"]

  # --- process devices ------------------------------------------------------------
  - id: process-device-parameter-manipulation
    rev: 1
    stride: [T]
    applies_to: [process-device]
    title:
      de: Manipulation von Prozessparametern in {element}
      en: Manipulation of process parameters in {element}
    scenario:
      de: >-
        Das Prozessgerät übernimmt Sollwerte und Programmnummern (z. B. Strom,
        Spannung, Temperatur, Zeiten) über Feldbus oder Netzwerk ohne Prüfung des
        Absenders. Ein Angreifer mit Zugang zur Kommunikation verändert diese Werte
        dauerhaft im Gerät oder während der Übertragung.
      en: >-
        The process device accepts set points and program numbers (e.g. current,
        voltage, temperature, times) via fieldbus or network without checking the
        sender. An attacker with access to the communication changes these values
        permanently in the device or during transmission.
    consequence:
      de: >-
        Es entstehen fehlerhafte Produkte, die unter Umständen erst beim Kunden
        versagen; Überhitzung oder Prozessstörungen können Anlage und Personen
        gefährden.
      en: >-
        Defective products are produced that may only fail at the customer;
        overheating or process disturbances can endanger plant and persons.
    environment: {interface: local, access: restricted}
    impact: 4
    safety_related: true
    cra_refs: [AI-I-2-f, AI-I-2-d]
    attack_ics: [T0836]
    iec62443: [FR3, FR1]
    measures: [parameter-plausibility, recipe-change-approval, config-integrity-check, security-logging]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: process-device-own-network-interface
    rev: 1
    stride: [S, E]
    applies_to: [process-device]
    title:
      de: Eigene Netzwerkschnittstelle von {element} umgeht die Steuerung
      en: Own network interface of {element} bypasses the controller
    scenario:
      de: >-
        Das Prozessgerät hat neben dem Feldbus eine eigene Ethernet-Schnittstelle
        mit Webserver oder Herstellerprotokoll, oft mit Standard-Passwort oder ganz
        ohne Anmeldung. Ein Angreifer im Netz meldet sich mit bekannten Zugangsdaten
        an und erhält Administratorrechte am Gerät.
      en: >-
        Besides the fieldbus, the process device has its own Ethernet interface
        with a web server or vendor protocol, often with a default password or no
        login at all. An attacker in the network logs in with known credentials and
        gains administrator rights on the device.
    consequence:
      de: >-
        Prozess, Firmware und Konfiguration des Geräts stehen unter fremder
        Kontrolle, ohne dass die Maschinensteuerung beteiligt ist.
      en: >-
        Process, firmware and configuration of the device are under foreign
        control without involvement of the machine controller.
    environment: {interface: known_network, access: restricted}
    impact: 4
    cra_refs: [AI-I-2-b, AI-I-2-d, AI-I-2-j]
    attack_ics: [T1694, T0859]
    emb3d: [TID-311, TID-310]
    iec62443: [FR1, FR5]
    measures: [no-default-passwords, unique-device-credentials, network-segmentation, least-privilege-services]
    sources: ["generic OT threat knowledge; MITRE EMB3D"]

  - id: field-device-firmware-via-usb
    rev: 1
    stride: [T]
    applies_to: [process-device, drive]
    title:
      de: Unsignierte Firmware wird per USB auf {element} geladen
      en: Unsigned firmware is loaded onto {element} via USB
    scenario:
      de: >-
        Das Gerät nimmt Firmware-Updates von einem USB-Stick oder über die
        Service-Schnittstelle an und prüft dabei weder Herkunft noch Integrität.
        Ein Angreifer oder ein infizierter Service-Laptop spielt eine veränderte
        Firmware ein.
      en: >-
        The device accepts firmware updates from a USB stick or via the service
        interface without checking origin or integrity. An attacker or an infected
        service laptop installs modified firmware.
    consequence:
      de: >-
        Das Gerät führt fremden Code aus und kann dauerhaft manipuliert oder
        unbrauchbar gemacht werden.
      en: >-
        The device executes foreign code and can be permanently manipulated or
        rendered unusable.
    environment: {interface: physical, access: restricted}
    impact: 4
    cra_refs: [AI-I-2-f, AI-II-7]
    attack_ics: [T1693]
    emb3d: [TID-211, TID-213]
    iec62443: [FR3]
