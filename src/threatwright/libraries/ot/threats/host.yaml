  # --- removable media and service laptop ------------------------------------------------
  - id: usb-malware-autorun
    rev: 1
    stride: [T, E]
    applies_to: [removable-media, ipc-windows, ipc-linux, hmi, engineering-workstation]
    title:
      de: Schadsoftware gelangt per USB-Datenträger auf {element}
      en: Malware reaches {element} via USB storage
    scenario:
      de: >-
        Ein Servicetechniker oder Bediener steckt einen infizierten
        USB-Datenträger an, etwa für ein Backup, ein Update oder einen
        Datenexport. Schadsoftware startet über Autorun, präparierte
        Verknüpfungen oder ausführbare Dateien und kopiert sich auf das System
        und weitere Datenträger.
      en: >-
        A service technician or operator plugs in an infected USB stick, for
        example for a backup, an update or a data export. Malware starts via
        autorun, crafted shortcuts or executable files and copies itself to the
        system and further media.
    consequence:
      de: >-
        Kompromittierung des Steuerungsrechners trotz fehlender Netzverbindung
        nach außen und Weiterverbreitung auf andere Anlagen.
      en: >-
        Compromise of the controller host despite having no external network
        connection, and further spread to other plants.
    environment: {interface: local, access: public_restricted, user: instructed}
    impact: 4
    safety_related: false
    cra_refs: [AI-I-2-j, AI-I-2-k]
    attack_ics: [T0847, T0895]
    iec62443: [FR3]
    measures: [usb-port-control, autorun-disabled, media-scanning-station, malware-protection]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: usb-badusb-keyboard
    rev: 1
    stride: [S, E]
    applies_to: [removable-media, hmi, ipc-windows, ipc-linux, engineering-workstation]
    title:
      de: USB-Gerät gibt sich als Tastatur aus und steuert {element}
      en: USB device poses as a keyboard and controls {element}
    scenario:
      de: >-
        Ein präparierter USB-Stick oder ein unscheinbares Kabel meldet sich am
        Gerät nicht als Speicher, sondern als Tastatur oder Netzwerkkarte an.
        Innerhalb von Sekunden tippt es Befehle ein, öffnet eine Konsole oder
        leitet den Netzverkehr um.
      en: >-
        A crafted USB stick or an inconspicuous cable registers with the device
        not as storage but as a keyboard or network adapter. Within seconds it
        types commands, opens a console or redirects network traffic.
    consequence:
      de: >-
        Der Angreifer führt Befehle mit den Rechten der angemeldeten Sitzung
        aus, ohne dass ein Passwort abgefragt wird.
      en: >-
        The attacker executes commands with the rights of the logged-in session
        without being asked for a password.
    environment: {interface: physical, access: public_restricted}
    impact: 4
    safety_related: false
    cra_refs: [AI-I-2-j, AI-I-2-d]
    attack_ics: [T0847]
    iec62443: [FR2]
    measures: [usb-port-control, kiosk-mode, physical-access-control]
    sources: ["generic OT threat knowledge; ATT&CK for ICS v20"]

  - id: usb-manipulated-file-import
    rev: 1
    stride: [S, T]
    applies_to: [removable-media, hmi, ipc-windows, ipc-linux, recipe-store]
    title:
      de: Manipulierte Rezept- oder Projektdatei wird per USB in {element} geladen
      en: Manipulated recipe or project file is loaded into {element} via USB
    scenario:
      de: >-
        Rezepte, Parameter oder Projektdateien werden per USB-Datenträger
        eingespielt. Das Gerät prüft weder Herkunft noch Integrität der Datei.
        Ein Angreifer legt eine Datei bereit, die wie eine freigegebene Datei
        aussieht, aber veränderte Werte oder präparierte Inhalte enthält, die
        beim Einlesen einen Fehler im Parser ausnutzen.
      en: >-
        Recipes, parameters or project files are imported via USB storage. The
        device checks neither origin nor integrity of the file. An attacker
        provides a file that looks like an approved file but contains altered
        values or crafted content that exploits a flaw in the parser on import.
    consequence:
      de: >-
        Falsche Prozesswerte führen zu Ausschuss oder Maschinenschäden, ein
        Parserfehler kann zur Codeausführung auf dem Gerät führen.
      en: >-
        Wrong process values lead to scrap or machine damage; a parser flaw can
        lead to code execution on the device.
    environment: {interface: local, access: public_restricted, user: instructed}
    impact: 4
    safety_related: true
