    sources: ["generic OT threat knowledge; ATT&CK for ICS v20; MITRE EMB3D"]

  - id: removable-media-untraceable
    rev: 1
    stride: [R]
    applies_to: [removable-media, hmi, ipc-windows, ipc-linux]
    title:
      de: Nicht nachvollziehbar, welche Dateien per {element} übertragen wurden
      en: Untraceable which files were transferred via {element}
    scenario:
      de: >-
        Das System protokolliert nicht, wann welcher Datenträger angesteckt und
        welche Dateien importiert oder exportiert wurden. Eine Person spielt
        eine schädliche Datei ein oder kopiert vertrauliche Daten und bestreitet
        dies später.
      en: >-
        The system does not record when which storage medium was plugged in and
        which files were imported or exported. A person loads a harmful file or
        copies confidential data and later denies it.
    consequence:
      de: >-
        Infektionsweg und Datenabfluss lassen sich nicht aufklären, die
        Bereinigung und die Meldung eines Vorfalls verzögern sich.
      en: >-
        Infection path and data leakage cannot be clarified; clean-up and
