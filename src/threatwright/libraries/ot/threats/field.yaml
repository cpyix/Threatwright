    consequence:
      de: >-
        Maschinen-Know-how geht verloren und der Angreifer kennt Verriegelungen und
        Adressbelegung für gezielte Manipulation.
      en: >-
        Machine know-how is lost and the attacker learns interlocks and address
        assignments for targeted manipulation.
    environment: {interface: known_network, access: restricted}
    impact: 3
    cra_refs: [AI-I-2-e, AI-I-2-d]
