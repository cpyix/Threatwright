name: leakcheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  leakcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just HEAD
          persist-credentials: false

      - name: Forbidden files (AI tooling, local config, secrets)
        run: python3 scripts/check_forbidden_files.py

      - name: Secret scan (gitleaks, full history)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
